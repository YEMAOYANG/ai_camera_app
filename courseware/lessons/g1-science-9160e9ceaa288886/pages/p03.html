<div id="observe-board">
 <button id="observe-reset" class="btn ghost" aria-label="重新开始观察">↺</button>
 <div id="observe-window"><img id="observe-object" src="__IMG:leaf__" alt="待仔细观察的叶片"><div id="observe-lens" aria-hidden="true"></div></div>
 <div id="observe-actions">
  <button id="observe-choice-observe" class="observe-choice" data-method="observe" aria-label="拿放大镜对着实物观察"><img src="__IMG:observe__" alt="女孩拿放大镜仔细看实物"></button>
  <button id="observe-choice-guess" class="observe-choice" data-method="guess" aria-label="闭眼想象"><img src="__IMG:guess__" alt="闭眼凭空想象"></button>
  <button id="observe-choice-leave" class="observe-choice" data-method="leave" aria-label="背对实物走开"><img src="__IMG:leave__" alt="背对桌面离开"></button>
 </div>
 <div id="observe-record" aria-label="已经找到的实物线索"></div>
</div>
