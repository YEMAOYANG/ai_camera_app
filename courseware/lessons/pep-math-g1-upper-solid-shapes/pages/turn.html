<div class="solid-board" id="turn-table">
  <aside class="solid-token">
    <img id="turn-target" alt="本轮要找的模型" src="__IMG:model-cube__" data-form="cube">
    <span>找同形</span>
  </aside>
  <div class="solid-cards turn-pair">
    <button type="button" class="solid-card" id="turn-flat" aria-label="左边的盒子">
      <img alt="" src="__IMG:face-front__" data-form="square">
    </button>
    <button type="button" class="solid-card" id="turn-cube" aria-label="右边的盒子">
      <img alt="" src="__IMG:face-front__" data-form="square">
    </button>
  </div>
  <button type="button" class="solid-command" id="turn-control" aria-label="转动两个盒子">
    <svg viewBox="0 0 80 48" width="80" height="48" aria-hidden="true">
      <path d="M16 28a24 15 0 0 1 44-7m-11 0 12 2 1-12M64 28a24 15 0 0 1-44 7m11 0-12-2-1 12" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>
