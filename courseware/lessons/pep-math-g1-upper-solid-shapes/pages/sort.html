<div class="solid-board sort-board">

    <img id="sort-current" alt="还没归架的物品" src="__IMG:eraser__" data-form="box">

    <path d="M35 4v40m-15-14 15 14 15-14" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div id="sort-shelf" class="solid-cards sort-shelf">

      <img class="model" alt="" src="__IMG:model-box__" data-form="box"><img class="stored" alt="" hidden>

    <button type="button" class="solid-card" data-family="cube" aria-label="正方体架">
      <img class="model" alt="" src="__IMG:model-cube__" data-form="cube"><img class="stored" alt="" hidden>
    </button>
    <button type="button" class="solid-card" data-family="tube" aria-label="圆柱架">
      <img class="model" alt="" src="__IMG:model-tube__" data-form="tube"><img class="stored" alt="" hidden>
