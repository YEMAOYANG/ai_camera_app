<div id="tool-board">
 <button id="tool-part" aria-label="把合适模拟动作送到这里"><img id="tool-part-photo" src="__IMG:pad__" alt="当前要模拟的身体部位"><span id="tool-model"></span></button>
 <div id="tool-choices">
  <button id="tool-choice-soft" class="tool-choice" data-tool="soft" aria-label="海绵垫模拟"><img src="__IMG:table-soft__" alt="手指垫海绵"></button>
  <button id="tool-choice-cone" class="tool-choice" data-tool="cone" aria-label="纸卷模拟"><img src="__IMG:listen-cone__" alt="纸卷靠耳外"></button>
  <button id="tool-choice-bare" class="tool-choice" data-tool="bare" aria-label="不加模拟物"><img src="__IMG:table-bare__" alt="手指直接接触桌面"></button>
 </div>
 <div id="tool-record" aria-label="身体部位和模拟工具配对记录"></div>
 <button id="tool-reset" class="btn ghost" aria-label="重新配工具">↺</button>
</div>
