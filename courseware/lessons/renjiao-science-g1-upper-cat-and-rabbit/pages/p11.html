<div id="listen-board">
 <div id="listen-stage"><img id="listen-photo" src="__IMG:listen-bare__" alt="当前听法动作"></div>
 <div id="listen-choices">
  <button id="listen-normal" data-method="normal" aria-label="直接听"><img src="__IMG:listen-bare__" alt="双手放下直接听"></button>
  <button id="listen-hand" data-method="hand" aria-label="弯手放耳旁听"><img src="__IMG:listen-cup__" alt="弯手放耳旁听"></button>
  <button id="listen-paper" data-method="paper" aria-label="纸卷靠耳外听"><img src="__IMG:listen-cone__" alt="纸卷靠耳外听"></button>
 </div>
 <button id="listen-replay" class="btn ghost" aria-label="再看刚才的听法">▷</button>
 <div id="listen-strip" aria-label="三次听法的动作记录"></div>
 <button id="listen-reset" class="btn ghost" aria-label="重新安排听法">↺</button>
</div>
