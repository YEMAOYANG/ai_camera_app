<div id="scan-board">
 <div id="scan-photo" role="img" aria-label="猫兔全身与局部观察画面"></div>
 <div id="scan-choices">
  <button id="scan-whole" data-view="whole" aria-label="先看全身"><span class="scan-view whole"></span></button>
  <button id="scan-head" data-view="head" aria-label="再看头和颈"><span class="scan-view head"></span></button>
  <button id="scan-body" data-view="body" aria-label="看躯干"><span class="scan-view body"></span></button>
  <button id="scan-legs" data-view="legs" aria-label="看四肢"><span class="scan-view legs"></span></button>
  <button id="scan-tail" data-view="tail" aria-label="最后看尾"><span class="scan-view tail"></span></button>
  <button id="scan-reset" class="btn ghost" aria-label="重新观察">↺</button>
 </div>
 <div id="scan-strip" aria-label="按顺序留下的观察记录"></div>
</div>
