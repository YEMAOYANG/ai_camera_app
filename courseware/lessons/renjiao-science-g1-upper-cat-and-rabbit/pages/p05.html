<div id="compare-board">
 <div id="compare-card" role="button" tabindex="0" aria-label="选中或拖动身体照片"><img id="compare-image" src="__IMG:cat-tail__" alt="待整理的身体照片"></div>
 <button id="compare-cat" class="compare-zone" data-zone="cat" aria-label="猫这一边"><img src="__IMG:cat-orange__" alt="猫"><span class="compare-slot"></span></button>
 <button id="compare-both" class="compare-zone" data-zone="both" aria-label="猫和兔共有"><img src="__IMG:pair-legs__" alt="猫和兔共同在一起"><span class="compare-slot"></span></button>
 <button id="compare-rabbit" class="compare-zone" data-zone="rabbit" aria-label="兔这一边"><img src="__IMG:rabbit-white__" alt="兔"><span class="compare-slot"></span></button>
 <div id="compare-record" aria-label="已留下的比较记录"></div>
 <button id="compare-reset" class="btn ghost" aria-label="重新整理">↺</button>
</div>
