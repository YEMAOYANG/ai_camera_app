<section class="forge" aria-label="把纸条改成结实的纸蜻蜓">
  <figure class="craft-model" id="forge-board">
    <img id="forge-paper" src="__IMG:paper-0__" alt="原纸条的横虚线">
  </figure>
  <div class="forge-actions" id="forge-actions" aria-label="选一幅动作图">
    <button type="button" id="forge-a"><img src="__IMG:paper-1__" alt="剪两侧短口"></button>
    <button type="button" id="forge-b"><img src="__IMG:paper-0__" alt="沿横虚线对折"></button>
  </div>
  <div id="forge-message" class="forge-caption" aria-live="polite"></div>
  <button type="button" id="forge-retry" class="forge-retry hide" aria-label="重新加载纸样图片">↻</button>
</section>
