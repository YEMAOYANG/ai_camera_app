<section id="pack-board">
  <div id="pack-targets" aria-label="两个收纳位置">
    <button type="button" id="pack-case" data-target="case" aria-label="收进打开的笔袋">
      <img src="__IMG:pencilcase__" alt="打开的笔袋"><span id="pack-case-items" class="pack-received"></span>
    </button>
    <button type="button" id="pack-bag" data-target="bag" aria-label="书和本放进书包大袋">
      <img src="__IMG:empty-bag__" alt="打开的书包大袋"><span id="pack-bag-items" class="pack-received"></span>
    </button>
  </div>
  <div id="pack-items" aria-label="桌上的文具和书本">
    <button type="button" id="pack-pencil" data-item="pencil" data-home="case" aria-label="铅笔"><img src="__IMG:pencil__" alt="铅笔"></button>
    <button type="button" id="pack-eraser" data-item="eraser" data-home="case" aria-label="橡皮"><img src="__IMG:eraser__" alt="橡皮"></button>
    <button type="button" id="pack-textbook" data-item="textbook" data-home="bag" aria-label="课本"><img src="__IMG:textbook__" alt="课本"></button>
    <button type="button" id="pack-exercisebook" data-item="exercisebook" data-home="bag" aria-label="作业本"><img src="__IMG:exercisebook__" alt="作业本"></button>
  </div>
</section>
