<section id="tool-board">
  <div id="tool-clue"><img id="tool-clue-image" src="__IMG:task-erase__" alt="要处理的桌面情境"></div>
  <div id="tool-drop" role="group" aria-label="文具工作区"></div>
  <div id="tool-choices" aria-label="可用文具">
    <button type="button" id="tool-eraser" data-tool="eraser" aria-label="橡皮"><img src="__IMG:eraser__" alt="橡皮"></button>
    <button type="button" id="tool-ruler" data-tool="ruler" aria-label="尺子"><img src="__IMG:ruler__" alt="尺子"></button>
    <button type="button" id="tool-pencilcase" data-tool="pencilcase" aria-label="笔袋"><img src="__IMG:pencilcase__" alt="笔袋"></button>
  </div>
</section>
