<img class="gallery-art" src="__IMG:sound-gallery-room__" alt="">
<div class="row-cue" aria-label="从左向右数">
  <span id="row-origin" class="origin-door" aria-hidden="true"></span><span id="row-arrow" class="route-arrow" aria-hidden="true">⟶</span>
</div>
<section id="row-exhibits" aria-label="一排五件乐器">
  <button id="row-drum" type="button" aria-label="大鼓"><img src="__IMG:instrument-drum__" alt="大鼓"></button>
  <button id="row-trumpet" type="button" aria-label="小号"><img src="__IMG:instrument-trumpet__" alt="小号"></button>
  <button id="row-piano" type="button" aria-label="钢琴"><img src="__IMG:instrument-piano__" alt="钢琴"></button>
  <button id="row-harp" type="button" aria-label="竖琴"><img src="__IMG:instrument-harp__" alt="竖琴"></button>
  <button id="row-tambourine" type="button" aria-label="铃鼓"><img src="__IMG:instrument-tambourine__" alt="铃鼓"></button>
</section>
<div id="row-task" aria-label="这一关找的位置"></div>
<section id="row-ranks" aria-label="位置选项" hidden>
  <button type="button" data-rank="1" aria-label="第一"></button>
  <button type="button" data-rank="2" aria-label="第二"></button>
  <button type="button" data-rank="4" aria-label="第四"></button>
</section>
