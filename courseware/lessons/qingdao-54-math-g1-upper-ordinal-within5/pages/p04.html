<img class="gallery-art" src="__IMG:sound-gallery-room__" alt="">
<div id="rack-cue">
  <div id="rack-task" aria-label="这一关找的格位"></div>
</div>
<div id="rack-direction" aria-label="数数方向">
  <span id="rack-top" class="rack-star" aria-label="上方星灯"></span>
  <span id="rack-arrow" aria-hidden="true"></span>
  <span id="rack-bottom" class="rack-bell" aria-label="下方门铃"></span>
</div>
<section id="rack-shelves" aria-label="从上到下四格">
  <button id="rack-one" type="button" aria-label="大鼓"><img src="__IMG:instrument-drum__" alt="大鼓"></button>
  <button id="rack-two" type="button" aria-label="钢琴"><img src="__IMG:instrument-piano__" alt="钢琴"></button>
  <button id="rack-three" type="button" aria-label="竖琴"><img src="__IMG:instrument-harp__" alt="竖琴"></button>
  <button id="rack-four" type="button" aria-label="铃鼓"><img src="__IMG:instrument-tambourine__" alt="铃鼓"></button>
</section>
