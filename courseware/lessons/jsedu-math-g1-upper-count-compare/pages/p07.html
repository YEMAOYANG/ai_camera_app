<header class="count-head"><h2>对齐以后比一比</h2><span id="count-round"></span></header>
<main id="count-main">
  <section class="count-panel" id="count-board" aria-label="两排印章比较板">
    <div id="count-top" class="count-strip" aria-label="太阳印"></div>
    <div id="count-bottom" class="count-strip" aria-label="叶印"></div>
  </section>
  <section class="count-adjust" aria-label="增减叶印">
    <button id="count-minus" class="btn ghost" aria-label="减少一枚叶印">−</button>
    <button id="count-plus" class="btn blue" aria-label="增加一枚叶印">+</button>
  </section>
</main>
<nav class="count-controls">
  <button class="btn blue" id="count-listen"><svg class="count-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 10v4h4l5 4V6l-5 4H3z"/><path d="M15 9a5 5 0 0 1 0 6m2-8a8 8 0 0 1 0 10"/></svg>听题</button>
  <button class="btn ghost" id="count-help"><svg class="count-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 18h6m-5 3h4M8 13c-2-3 0-8 4-8s6 5 4 8l-1 2H9l-1-2z"/></svg>提示</button>
  <button class="btn ghost" id="count-reload"><svg class="count-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 11a8 8 0 0 1 13-6l3 3m0-5v5h-5m5 5a8 8 0 0 1-13 6l-3-3m0 5v-5h5"/></svg>重载图片</button>
  <button class="btn green" id="count-check"><svg class="count-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12 4 4L19 6"/></svg>核对</button>
</nav>
