<section class="basket-activity">
  <div id="basket-view" class="basket-view">
    <img class="basket-picture" src="__IMG:story-basket__" alt="敞口的柳编小篮">
    <div id="basket-slot-one" class="basket-slot"><img alt=""></div>
    <div id="basket-slot-two" class="basket-slot"><img alt=""></div>
    <p id="basket-picture-error" class="picture-error hide" role="status">篮子图片暂时打不开，请重新打开本页。</p>
  </div>
  <div class="basket-options">
    <button id="choose-shell" class="btn basket-choice" aria-label="放入白贝壳"><img src="__IMG:story-shell__" alt="白贝壳"><span>贝壳</span></button>
    <button id="choose-shrimp" class="btn basket-choice" aria-label="放入青色小虾"><img src="__IMG:story-shrimp__" alt="青色小虾"><span>小虾</span></button>
    <button id="check-extra" class="btn basket-choice extra" aria-label="试放另一个同样大的贝壳"><img src="__IMG:story-shell__" alt="再试放一个白贝壳"><span>再放</span></button>
  </div>
</section>
