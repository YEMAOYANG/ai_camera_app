<section class="shore-activity">
  <div id="shore-view" class="shore-view" data-step="0">
    <img id="shore-picture" class="shore-picture" src="__IMG:shore-background__" alt="海水、沙滩和孩子的小脚丫">
    <svg class="shore-marks" viewBox="0 0 1232 356" preserveAspectRatio="none" data-semantic-diagram="shore-motion" aria-hidden="true">
      <path class="move-mark mark-come" d="M439 229 Q532 250 632 258 M612 235 L632 258 L608 277"/>
      <path class="move-mark mark-touch mark-touch-water" d="M550 272 Q614 259 670 284 T799 298"/>
      <ellipse class="move-mark mark-touch" cx="835" cy="315" rx="62" ry="23"/>
      <path class="move-mark mark-return" d="M665 273 Q548 273 449 235 M464 263 L449 235 L478 225"/>
    </svg>
  </div>
  <div class="shore-choices">
    <button id="come-choice" class="btn shore-choice incoming" aria-label="浪花向岸边靠近"><span class="shore-card" aria-hidden="true"></span><span>来</span></button>
    <button id="touch-choice" class="btn shore-choice touching" aria-label="浪花轻碰脚边"><span class="shore-card" aria-hidden="true"></span><span>碰</span></button>
    <button id="return-choice" class="btn shore-choice outgoing" aria-label="浪花退回海里"><span class="shore-card" aria-hidden="true"></span><span>回</span></button>
  </div>
  <p id="shore-picture-error" class="picture-error hide" role="status">海边图片暂时打不开，请重新打开本页。</p>
</section>
