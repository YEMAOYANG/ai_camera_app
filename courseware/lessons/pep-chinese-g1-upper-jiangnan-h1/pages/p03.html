<div class="word-pond">

  <div class="target-wrap">
    <span class="look-mark" aria-hidden="true"></span>
    <button id="character" class="character" aria-label="要找的大字"><span id="target-char">莲</span><span id="grass-radical" aria-hidden="true"></span></button>
  </div>
  <div id="pictures" class="word-leaves" aria-label="莲叶上的字">
    <button id="lotus" class="picture word-leaf" aria-label="第一片莲叶"><span></span></button>
    <button class="picture word-leaf" aria-label="第二片莲叶"><span></span></button>
    <button class="picture word-leaf" aria-label="第三片莲叶"><span></span></button>
  </div>
  <div id="fish" class="fish-sprite" role="button" aria-label="把小鱼送到相同的字旁" tabindex="0"></div>
</div>
