<section id="board" aria-label="整理安全做法">
  <div id="body" class="body-card">
    <div class="body-picture" role="img" aria-label="女孩用感觉器官观察周围"></div>
    <i class="zone" id="eye-zone"></i><i class="zone" id="ear-zone"></i><i class="zone" id="nose-zone"></i><i class="zone" id="skin-zone"></i>
    <div class="zone-dock" id="zones">
      <button class="zone-eye" data-zone="eye" aria-label="眼睛"></button>
      <button class="zone-ear" data-zone="ear" aria-label="耳朵"></button>
      <button class="zone-nose" data-zone="nose" aria-label="鼻子"></button>
      <button class="zone-skin" data-zone="skin" aria-label="皮肤"></button>
    </div>
  </div>
  <div class="work">
    <div id="tray" class="tray"></div>
    <div class="hint-pic" aria-hidden="true">↗</div>
    <button id="check" class="round green" aria-label="继续">✓</button>
    <div id="result" aria-live="polite"></div>
  </div>
</section>
