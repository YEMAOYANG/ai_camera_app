<div id="guess-room" class="guess-room">
  <button id="guess-listen" aria-label="再听线索">♪</button>
  <img id="guess-desk" src="__IMG:obj-desk__" alt="桌子">
  <button id="guess-car" class="guess-toy" data-toy="car" aria-label="猜玩具车">
    <img src="__IMG:obj-car__" alt="玩具车">
  </button>
  <button id="guess-bear" class="guess-toy" data-toy="bear" aria-label="猜玩具熊">
    <img src="__IMG:obj-bear__" alt="玩具熊">
  </button>
  <button id="guess-hat" class="guess-toy" data-toy="hat" aria-label="猜帽子">
    <img src="__IMG:obj-hat__" alt="帽子">
  </button>
  <div id="guess-tray" aria-label="验证区"></div>
  <div id="guess-media-error" class="guess-media-error hide">
    <button aria-label="重新加载图片">↻</button>
    <p>图片加载失败，请点重试</p>
  </div>
</div>
