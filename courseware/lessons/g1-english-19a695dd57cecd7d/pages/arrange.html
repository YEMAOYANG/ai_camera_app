<div id="arrange-room" class="room">
  <div class="cue"><button id="arrange-listen" aria-label="再听一次">♪</button><img id="arrange-target" src="__IMG:obj-bear__" alt="要摆放的物品" hidden></div>
  <img id="arrange-bed" class="furniture bed" src="__IMG:obj-bed__" alt="床">
  <img id="arrange-desk" class="furniture desk" src="__IMG:obj-desk__" alt="桌子">
  <img id="arrange-box" class="furniture box" src="__IMG:obj-box__" alt="盒子">
  <button id="arrange-on" class="zone z-on" data-place="on" aria-label="床上面"></button>
  <button id="arrange-under" class="zone z-under" data-place="under" aria-label="桌子下面"></button>
  <button id="arrange-in" class="zone z-in" data-place="in" aria-label="盒子里面"></button>
  <button id="arrange-bear" class="toy bear" data-toy="bear" aria-label="玩具熊"><img src="__IMG:obj-bear__" alt="玩具熊"></button>
  <button id="arrange-hat" class="toy hat" data-toy="hat" aria-label="帽子"><img src="__IMG:obj-hat__" alt="帽子"></button>
  <button id="arrange-car" class="toy car" data-toy="car" aria-label="玩具车"><img src="__IMG:obj-car__" alt="玩具车"></button>
  <img class="furniture box box-front" src="__IMG:obj-box__" alt="" aria-hidden="true">
  <div id="arrange-media-error" class="media-error hide"><button aria-label="重新加载图片">↻</button><p>图片加载失败，请点重试</p></div>
</div>
