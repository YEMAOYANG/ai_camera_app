<div id="position-room" class="room">
  <div class="cue"><button id="position-listen" aria-label="再听一次">♪</button><strong id="position-word">under</strong></div>
  <img id="position-bed" class="furniture bed" src="__IMG:obj-bed__" alt="床">
  <img id="position-box" class="furniture box" src="__IMG:obj-box__" alt="敞口盒子">
  <button id="position-on" class="zone z-on" data-place="on" aria-label="床上面"></button>
  <button id="position-under" class="zone z-under" data-place="under" aria-label="床下面"></button>
  <button id="position-in" class="zone z-in" data-place="in" aria-label="盒子里面"></button>
  <button id="position-car" class="toy" aria-label="玩具车"><img src="__IMG:obj-car__" alt="玩具车"></button>
  <img class="furniture box box-front" src="__IMG:obj-box__" alt="" aria-hidden="true">
  <div id="position-media-error" class="media-error hide"><button aria-label="重新加载图片">↻</button><p>图片加载失败，请点重试</p></div>
</div>
