<section id="disc-board" class="work-board" data-semantic-diagram="四枚可数圆贴在两个托盘的位置">
  <img class="scene-art" src="__IMG:label-station__" alt="左青右黄的两个分装托盘">
  <button id="disc-left" class="drop-tray" type="button" aria-label="左边托盘"></button>
  <button id="disc-right" class="drop-tray" type="button" aria-label="右边托盘"></button>
</section>
<section class="work-controls" aria-label="圆贴、分法参考和确认">
  <div id="disc-target" aria-label="本轮的分法图"><span></span><span></span></div>
  <div id="disc-bank" aria-label="选择一枚圆贴">
    <button class="loose-disc" type="button" aria-label="圆贴一"></button><button class="loose-disc" type="button" aria-label="圆贴二"></button>
    <button class="loose-disc" type="button" aria-label="圆贴三"></button><button class="loose-disc" type="button" aria-label="圆贴四"></button>
  </div>
  <button id="disc-check" class="btn" type="button">对一对</button>
  <button id="disc-reset" class="btn" type="button" data-activity-reset>重新摆</button>
</section>
