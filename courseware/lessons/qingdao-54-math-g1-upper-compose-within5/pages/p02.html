<section id="seed-board" class="work-board" data-semantic-diagram="同一批五粒种子在两个位置移动">
  <img class="scene-art" src="__IMG:seed-workbench__" alt="左边青色纸袋和右边黄色纸袋">
  <div id="seed-left" class="seed-pile" aria-label="左边的种子"></div>
  <div id="seed-right" class="seed-pile" aria-label="右边的种子"></div>
  <span id="seed-direction" aria-hidden="true">←</span>
</section>
<section class="work-controls" aria-label="选择移动的数量">
  <div id="seed-choices" class="choice-row"><button id="seed-choice-a" type="button"></button><button id="seed-choice-b" type="button"></button></div>
  <div id="seed-history" aria-label="从左一右四到左四右一的记录"></div>
</section>
