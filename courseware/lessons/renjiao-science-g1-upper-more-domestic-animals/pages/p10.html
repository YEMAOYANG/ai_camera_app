<div id="book-board">
 <div id="book-paper">
  <img id="book-animal" src="__IMG:dog__" alt="这本书的动物">
  <img id="book-model" src="__IMG:hen__" alt="同一方面的示例">
  <button id="book-target" aria-label="把照片放进当前书页"><img id="book-page-photo" alt="已经装进书页的生活照片"></button>
 </div>
 <div id="book-choices">
  <button id="book-choice-look" class="book-choice" data-kind="look" aria-label="完整身体照片"><img src="__IMG:dog__" alt="当前动物完整身体"></button>
  <button id="book-choice-eat" class="book-choice" data-kind="eat" aria-label="进食照片"><img src="__IMG:dog-eat__" alt="当前动物进食"></button>
  <button id="book-choice-move" class="book-choice" data-kind="move" aria-label="运动照片"><img src="__IMG:dog-move__" alt="当前动物运动"></button>
  <button id="book-reset" class="btn ghost" aria-label="重新整理小书">↺</button>
 </div>
 <div id="book-record" aria-label="当前小书已经整理的三页"></div>
</div>
