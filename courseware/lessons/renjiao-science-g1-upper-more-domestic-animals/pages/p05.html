<div id="match-board">
 <div id="match-source" role="button" tabindex="0" aria-label="选中或拖动鸡的生活照片"><img id="match-photo" src="__IMG:hen-eat__" alt="待对应的鸡生活照片"></div>
 <div id="match-table">
  <button id="match-eat" data-kind="eat" aria-label="狗与鸡的进食比较"><img src="__IMG:dog-eat__" alt="狗进食的线索"><span class="match-slot"></span></button>
  <button id="match-move" data-kind="move" aria-label="狗与鸡的运动比较"><img src="__IMG:dog-move__" alt="狗运动的线索"><span class="match-slot"></span></button>
  <button id="match-grow" data-kind="grow" aria-label="狗与鸡的长大比较"><img src="__IMG:dog-grow__" alt="狗长大的示意"><span class="match-slot"></span></button>
  <button id="match-family" data-kind="family" aria-label="狗与鸡的下一代比较"><img src="__IMG:dog-family__" alt="狗与下一代相伴"><span class="match-slot"></span></button>
 </div>
 <button id="match-reset" class="btn ghost" aria-label="重新比较">↺</button>
</div>
