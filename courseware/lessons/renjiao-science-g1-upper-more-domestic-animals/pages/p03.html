<div id="album-board">
 <div id="album-main"><img id="album-photo" src="__IMG:dog-eat__" alt="狗的生活线索"></div>
 <div id="album-tabs">
  <button id="album-eat" data-kind="eat" aria-label="看进食情境"><img src="__IMG:dog-eat__" alt="狗在进食"></button>
  <button id="album-move" data-kind="move" aria-label="看运动情境"><img src="__IMG:dog-move__" alt="狗在运动"></button>
  <button id="album-grow" data-kind="grow" aria-label="看长大示意"><img src="__IMG:dog-grow__" alt="幼犬到成犬的长大示意"></button>
  <button id="album-family" data-kind="family" aria-label="看下一代情境"><img src="__IMG:dog-family__" alt="成年犬与幼犬相伴"></button>
 </div>
 <div id="album-record" aria-label="看过的生活线索"></div>
 <button id="album-reset" class="btn ghost" aria-label="重新打开相册">↺</button>
</div>
