<div id="grow-board">
 <img id="grow-animal" src="__IMG:dog__" alt="当前观察的动物">
 <div id="grow-early" class="grow-frame" aria-label="幼小的时候"></div>
 <div id="grow-arrow" aria-hidden="true">→</div>
 <div id="grow-late" class="grow-frame" aria-label="长大以后"></div>
 <div id="grow-choices">
  <button id="grow-puppy" data-animal="dog" data-age="early" aria-label="幼小的狗"><img src="__IMG:puppy__" alt="幼小的狗"></button>
  <button id="grow-dog" data-animal="dog" data-age="late" aria-label="成年狗"><img src="__IMG:dog__" alt="成年狗"></button>
  <button id="grow-chick" data-animal="hen" data-age="early" aria-label="幼小的鸡"><img src="__IMG:chick__" alt="幼小的鸡"></button>
  <button id="grow-hen" data-animal="hen" data-age="late" aria-label="成年鸡"><img src="__IMG:hen__" alt="成年鸡"></button>
 </div>
 <button id="grow-reset" class="btn ghost" aria-label="重新排成长图">↺</button>
</div>
