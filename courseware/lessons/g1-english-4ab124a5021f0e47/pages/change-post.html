<section id="flight-field" aria-label="观察鸟儿的两处站位">
  <div id="far-pattern" lang="en">That is...</div>
  <button id="post-left" class="bird-choice" type="button" aria-label="蓝色的鸟">
    <img src="__IMG:blue-bird__" alt="蓝色小鸟"><span class="picture-fallback">蓝鸟</span>
  </button>
  <button id="post-right" class="bird-choice" type="button" aria-label="黄色的鸟">
    <img src="__IMG:yellow-bird__" alt="黄色小鸟"><span class="picture-fallback">黄鸟</span>
  </button>
  <div id="walking-trail" aria-hidden="true"></div>
  <div id="station-guide" aria-label="说英语的小观察员">
    <img src="__IMG:observer__" alt="小观察员"><span class="picture-fallback">观察员</span>
  </div>
  <div id="sighting-card" aria-label="记录下来的小鸟" aria-live="polite"><img alt=""><span class="picture-fallback"></span></div>
</section>
