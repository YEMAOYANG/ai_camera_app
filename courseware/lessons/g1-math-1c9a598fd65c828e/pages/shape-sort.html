<section id="shape-stage" class="shape-stage">
  <div id="shape-tray" class="shape-tray">
    <h2>看外边的样子</h2>
    <button id="shape-ball" class="shape-item" aria-label="选择皮球" data-item="ball"><img src="__IMG:ball__" alt="圆圆的橙色皮球"></button>
    <button id="shape-book" class="shape-item" aria-label="选择书封面" data-item="book"><img src="__IMG:book__" alt="长长方方的绿色书封面"></button>
  </div>
  <div id="shape-round" class="shape-target" role="button" tabindex="0" data-hit="true" aria-label="圆圆的外形区域" data-shape="round">
    <span class="shape-outline round-outline" data-semantic-diagram="圆形轮廓"></span><span class="shape-dock"></span><img id="shape-demo-sample" class="shape-demo-sample" src="__IMG:ball__" alt="教师把皮球放在圆形轮廓里示范" hidden>
  </div>
  <div id="shape-long" class="shape-target" role="button" tabindex="0" data-hit="true" aria-label="长长方方的外形区域" data-shape="long">
    <span class="shape-outline long-outline" data-semantic-diagram="长方形轮廓"></span><span class="shape-dock"></span>
  </div>
</section>
