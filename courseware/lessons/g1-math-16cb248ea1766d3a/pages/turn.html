<div id="turn-prompt">把交流的三个动作排好</div>
<div id="turn-track" class="turn-track">
 <div id="turn-slot-1" class="turn-slot"><b>1</b><img class="hide" alt="第一步"></div>
 <div id="turn-slot-2" class="turn-slot"><b>2</b><img class="hide" alt="第二步"></div>
 <div id="turn-slot-3" class="turn-slot"><b>3</b><img class="hide" alt="第三步"></div>
</div>
<div id="turn-cards" class="turn-cards">
 <button id="turn-speak" class="turn-card" data-step="speak" aria-label="轮到自己后清楚说"><img src="__IMG:speak-turn__" alt="老师示意后男孩清楚表达"></button>
 <button id="turn-listen" class="turn-card" data-step="listen" aria-label="先安静倾听"><img src="__IMG:listen__" alt="男孩安静听同桌说完"></button>
 <button id="turn-hand" class="turn-card" data-step="hand" aria-label="想补充时举手等待"><img src="__IMG:raise-hand__" alt="男孩举手等待老师点到"></button>
</div>
<span id="turn-demo" class="turn-demo hide">老师示范</span>
<div id="lesson-media-error" class="hide" role="alert"><span>图片暂未载入，请重新加载</span><button id="lesson-media-retry" class="btn">重新加载图片</button></div>
