<div id="desk-instruction">你坐在桌子下方这一边</div>
<div id="desk-surface" class="desk-surface">
  <button id="desk-stack" class="desk-slot stack-slot" aria-label="桌面左上角书本位置"><span>左上角</span></button>
  <button id="desk-case" class="desk-slot case-slot" aria-label="桌面正前方文具盒位置"><span>正前方</span></button>
  <img id="desk-book-shown" class="placed-book hide" src="__IMG:math-book__" alt="数学书在左上角">

 <button id="desk-pencil" class="supply" data-item="case" aria-label="文具盒"><img src="__IMG:pencil-case__" alt="文具盒"><span>文具盒</span></button>
