<section id="sort-stage" aria-label="按颜色选鸟">
  <div id="sort-line"></div>
  <div id="sample-perch">
    <img id="colour-example" src="__IMG:bird-green__" alt="一只绿色小鸟">
    <span id="green-word" aria-hidden="true">green</span>
  </div>
  <div id="observe-slots" aria-label="已经挑出来的小鸟"></div>
</section>
<aside id="sort-picture-failure" class="hide" role="status">
  <p>图片暂时没打开。</p>
  <button id="reload-sorting" type="button">重试图片</button>
</aside>
