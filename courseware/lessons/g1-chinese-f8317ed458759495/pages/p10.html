<section class="spring-stage">
 <div id="spring-view">
  <img id="spring-image" src="__IMG:landscape__" alt="青山、清河、垂下绿枝的柳树和粉红桃树">
  <button class="spring-hit" id="spring-mountain" data-key="mountain" aria-label="远处的山"></button>
  <button class="spring-hit" id="spring-water" data-key="water" aria-label="河里的水"></button>
  <button class="spring-hit" id="spring-willow" data-key="willow" aria-label="绿柳树枝"></button>
  <button class="spring-hit" id="spring-peach" data-key="peach" aria-label="红桃花"></button>
  <button id="spring-retry" type="button" hidden aria-label="重新加载风景">↻</button>
 </div>
 <aside class="spring-panel">
  <p id="spring-word">水秀</p>
  <div id="spring-close" aria-hidden="true"></div>
 </aside>
</section>
