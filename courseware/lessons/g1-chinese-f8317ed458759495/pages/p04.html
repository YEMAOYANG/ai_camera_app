<section class="weather-stage">
  <button id="weather-token" class="token" aria-label="选择天气字卡">风</button>
  <div class="weather-board">
    <button id="weather-a" class="weather-tile" data-kind="rain" aria-label="有雨滴和水纹的图">
      <img src="__IMG:rain__" alt="雨滴落在水洼里"><span class="weather-stamp"></span>
    </button>
    <button id="weather-b" class="weather-tile" data-kind="wind" aria-label="布旗向一边飘的图">
      <img src="__IMG:wind__" alt="布旗被风吹起"><span class="weather-stamp"></span>
    </button>
  </div>
</section>
