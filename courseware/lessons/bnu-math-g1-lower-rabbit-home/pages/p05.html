<section class="stone-path" data-semantic-diagram="two-jumps-with-equal-intervals">
  <div id="path-equation" aria-live="polite"></div>
  <div id="path-track">
    <div id="path-ticks" aria-hidden="true"></div>
    <div id="path-start" class="path-marker" aria-label="出发位置"></div>
    <div id="path-ten" class="path-marker" aria-label="十所在的位置"></div>
    <div id="path-end" class="path-marker hide" aria-label="最后落点"></div>
    <svg id="path-arcs" width="1080" height="152" viewBox="0 0 1080 152" aria-hidden="true"></svg>
    <div id="path-rabbit"><img src="__IMG:rabbit-token__" alt="沿石径走的小兔子"></div>
  </div>
  <div id="path-choices" aria-label="可选择的步数图"></div>
</section>
