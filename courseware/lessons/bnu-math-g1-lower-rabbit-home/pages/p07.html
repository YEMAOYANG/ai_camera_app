<section class="rabbit-neighborhood">
  <img id="house-pair" src="__IMG:houses__" alt="左边红屋，右边蓝屋">
  <div class="room-boards">
    <div class="room red-room">
      <b id="left-number" class="room-count"></b>
      <div id="left-house" class="room-grid" aria-label="红屋的兔子"></div>
    </div>
    <span id="move-arrow" aria-hidden="true">←</span>
    <div class="room blue-room">
      <b id="right-number" class="room-count"></b>
      <div id="right-house" class="room-grid" aria-label="蓝屋的兔子"></div>
    </div>
  </div>
  <div id="total-strip" aria-live="polite"></div>
  <img id="rabbit-model" src="__IMG:rabbit-token__" class="hide" alt="">
</section>
