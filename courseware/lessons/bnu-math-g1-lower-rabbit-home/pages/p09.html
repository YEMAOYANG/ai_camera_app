<section class="box-kitchen" data-semantic-diagram="three-exact-boxes-and-a-target">
  <div class="order-ticket">
    <img src="__IMG:rabbit-token__" alt="等候餐点的小兔子">
    <b id="target-number"></b>
    <div id="target-count" aria-label="需要的种子饼"></div>
    <div id="extra-biscuits" aria-label="超出所需数量的饼"></div>
  </div>
  <div id="tray-choices" aria-label="三个候选饼盒"></div>
  <div id="delivery-mat" aria-label="把选中的两个饼盒放这里"></div>
  <div class="delivery-controls">
    <div id="delivery-total" aria-live="polite"></div>
    <button type="button" class="btn green" id="check-pair" aria-label="确认这两盒">✓</button>
  </div>
</section>
