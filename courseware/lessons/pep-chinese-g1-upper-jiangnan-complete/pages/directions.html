<div id="direction-word" class="direction-word" aria-label="本轮方位字">东</div>
<div id="direction-map" class="direction-map">
  <img class="map-picture" src="__IMG:pond-map__" alt="中央荷叶围出叶间水隙，四边是开阔水面">
  <img class="map-water" src="__IMG:pond-map__" alt="" aria-hidden="true">
  <div id="direction-labels" aria-label="这张方位板上北下南左西右东"><span class="label label-north">北</span><span class="label label-south">南</span><span class="label label-west">西</span><span class="label label-east">东</span></div>
  <button id="water-east" class="water-zone east" data-direction="东" aria-label="右边水面"></button>
  <button id="water-west" class="water-zone west" data-direction="西" aria-label="左边水面"></button>
  <button id="water-north" class="water-zone north" data-direction="北" aria-label="上方水面"></button>
  <button id="water-south" class="water-zone south" data-direction="南" aria-label="下方水面"></button>
  <button id="moving-fish" class="moving-fish" aria-label="移动小鱼"><img src="__IMG:fish__" alt="橘红色小鱼"></button>
</div>
