<div id="sentence-board" class="sentence-board">
  <img class="map-picture" src="__IMG:pond-map__" alt="中央荷叶簇与四周水面">
  <img class="map-water" src="__IMG:pond-map__" alt="" aria-hidden="true">
  <span class="map-label north">北</span><span class="map-label south">南</span><span class="map-label west">西</span><span class="map-label east">东</span>
  <div id="sentence-fish" class="sentence-fish"><img src="__IMG:fish__" alt="小鱼的位置"></div>
</div>
<div class="sentence-line"><span>鱼戏莲叶</span><button id="word-slot" aria-label="诗句末尾的方位字空位">?</button></div>
<div id="word-bank" class="word-bank">
  <button id="word-east" class="word-card" data-word="东" aria-label="东">东</button><button id="word-west" class="word-card" data-word="西" aria-label="西">西</button>
  <button id="word-south" class="word-card" data-word="南" aria-label="南">南</button><button id="word-north" class="word-card" data-word="北" aria-label="北">北</button>
</div>
