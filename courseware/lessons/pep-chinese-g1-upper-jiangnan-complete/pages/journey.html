<div id="journey-slots" class="journey-slots" aria-label="按古诗顺序放图的六个位置">
  <div class="journey-slot" data-index="0"><span class="slot-number">1</span></div><div class="journey-slot" data-index="1"><span class="slot-number">2</span></div><div class="journey-slot" data-index="2"><span class="slot-number">3</span></div>
  <div class="journey-slot" data-index="3"><span class="slot-number">4</span></div><div class="journey-slot" data-index="4"><span class="slot-number">5</span></div><div class="journey-slot" data-index="5"><span class="slot-number">6</span></div>
</div>
<div class="journey-arrow" aria-hidden="true">→</div>
<div id="journey-tray" class="journey-tray" aria-label="可移动的古诗画面">
  <button id="journey-card-1" class="journey-card opening" data-index="0" aria-label="莲叶茂盛的莲塘"><img class="card-map" src="__IMG:pond__" alt="满池莲叶"></button>
  <button id="journey-card-2" class="journey-card middle" data-index="1" aria-label="莲叶之间的小鱼"><img class="card-map" src="__IMG:empty__" alt=""><img class="card-leaf leaf-a" src="__IMG:leaf__" alt=""><img class="card-leaf leaf-b" src="__IMG:leaf__" alt=""><img class="card-leaf leaf-c" src="__IMG:leaf__" alt=""><img class="card-leaf leaf-d" src="__IMG:leaf__" alt=""><span class="card-fish" aria-hidden="true"></span></button>
  <button id="journey-card-3" class="journey-card east" data-index="2" aria-label="小鱼在荷叶东边"><img class="card-map" src="__IMG:empty__" alt=""><img class="card-leaf" src="__IMG:leaf__" alt=""><span class="card-fish" aria-hidden="true"></span></button>
  <button id="journey-card-4" class="journey-card west" data-index="3" aria-label="小鱼在荷叶西边"><img class="card-map" src="__IMG:empty__" alt=""><img class="card-leaf" src="__IMG:leaf__" alt=""><span class="card-fish" aria-hidden="true"></span></button>
  <button id="journey-card-5" class="journey-card south" data-index="4" aria-label="小鱼在荷叶南边"><img class="card-map" src="__IMG:empty__" alt=""><img class="card-leaf" src="__IMG:leaf__" alt=""><span class="card-fish" aria-hidden="true"></span></button>
  <button id="journey-card-6" class="journey-card north" data-index="5" aria-label="小鱼在荷叶北边"><img class="card-map" src="__IMG:empty__" alt=""><img class="card-leaf" src="__IMG:leaf__" alt=""><span class="card-fish" aria-hidden="true"></span></button>
</div>
