<div id="observe-board">
 <div id="observe-photo" role="img" aria-label="完整金鱼与局部观察画面"></div>
 <div id="observe-glass" aria-hidden="true"></div>
 <div id="observe-strip" aria-label="已经观察的部分"></div>
 <div id="observe-choices">
  <button id="observe-whole" data-view="whole" aria-label="看整条鱼"><span class="view whole"></span></button>
  <button id="observe-head" data-view="head" aria-label="看鱼头"><span class="view head"></span></button>
  <button id="observe-body" data-view="body" aria-label="看鱼的躯干"><span class="view body"></span></button>
  <button id="observe-tail" data-view="tail" aria-label="看鱼尾"><span class="view tail"></span></button>
 </div>
 <button id="observe-reset" class="btn ghost" aria-label="重新加载图片" hidden>↺</button>
</div>
