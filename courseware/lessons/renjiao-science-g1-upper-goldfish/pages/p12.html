<div id="care-board">
 <div id="care-scene" role="img" aria-label="需要改进的观察动作"></div>
 <div id="care-record" aria-label="改进后的观察记录"></div>
 <div id="care-choices">

  <button id="care-choice-tap" data-kind="tap" aria-label="敲碰鱼缸"><img src="__IMG:tap__" alt="男孩敲碰鱼缸"></button>
  <button id="care-choice-grab" data-kind="grab" aria-label="伸手碰金鱼"><img src="__IMG:grab__" alt="男孩把手伸到鱼缸里"></button>
 </div>
 <button id="care-reset" class="btn ghost" aria-label="重新加载图片" hidden>↺</button>
</div>
