<div id="life-board">
 <div id="life-source"><div id="life-card" data-hit="photo" role="button" tabindex="0" aria-label="选择或拖动观察照片"><img id="life-image" alt="观察照片"></div></div>
 <div id="life-lenses">
  <button id="life-mouth" class="life-lens" data-kind="food" aria-label="口取食的观察镜头"><img src="__IMG:mouth__" alt="金鱼嘴部近景"><div class="life-slot"></div></button>
  <button id="life-gill" class="life-lens" data-kind="breath" aria-label="鳃呼吸的观察镜头"><img src="__IMG:gill__" alt="金鱼头部后侧的鳃盖"><div class="life-slot"></div></button>
 </div>
 <button id="life-reset" class="btn ghost" aria-label="重新整理照片">↺</button>
</div>
