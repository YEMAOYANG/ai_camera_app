<section class="fold-work" aria-label="按图把纸条剪折成纸蜻蜓">
  <img class="fold-room" src="__IMG:workshop__" alt="">
  <div class="fold-board" id="fold-board">
    <img id="fold-paper" src="__IMG:paper-pattern__" alt="有四处剪折标记的纸条">
    <button class="fold-target" type="button" id="fold-target" aria-label="把选中的工具用在这个纸样位置"></button>
  </div>
  <div class="fold-tools" id="fold-tools" aria-label="选择一个操作">
    <button type="button" id="fold-cut" aria-label="用安全剪刀剪">
      <img src="__IMG:safe-scissors__" alt="">
      <span>剪</span>
    </button>
    <button type="button" id="fold-crease" aria-label="顺着折线折纸">
      <img src="__IMG:fold-tool__" alt="">
      <span>折</span>
    </button>
  </div>
  <div class="fold-note" id="fold-note" aria-live="polite">找到这一处纸样标记</div>
</section>
