<section class="predict-work" aria-label="用图片记录猜想">
  <div class="predict-pair" id="predict-pair">
    <img class="predict-context" src="__IMG:workshop__" alt="">
    <img class="predict-object" src="__IMG:flat-strip__" alt="平纸条">
    <img class="predict-object" src="__IMG:paper-rotor__" alt="纸蜻蜓">
  </div>
  <div class="predict-choices" id="predict-choices" data-semantic-diagram="两种下落猜想的相对位置和运动路径">
    <h2 id="predict-topic">快慢</h2>
    <button type="button" id="predict-same"></button>
    <button type="button" id="predict-different"></button>
  </div>
  <div class="predict-ledger" id="predict-ledger" aria-label="猜想记录夹">
    <div id="predict-record-1" class="predict-slot" aria-label="快慢记录"></div>
    <div id="predict-record-2" class="predict-slot" aria-label="路线记录"></div>
    <div id="predict-record-3" class="predict-slot" aria-label="动作记录"></div>
  </div>
  <button class="btn green" type="button" id="predict-save" aria-label="把选中的图放进记录夹">存到记录夹</button>
</section>
