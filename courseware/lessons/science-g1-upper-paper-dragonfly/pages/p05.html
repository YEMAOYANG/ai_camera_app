<section class="trial-work" aria-label="比较平纸条和纸蜻蜓的下落">
  <div class="trial-window" id="trial-window" data-semantic-diagram="同高起点、相对下落、旋转和路线示例">
    <img class="trial-room" src="__IMG:workshop__" alt="">
    <div class="trial-start-line" id="trial-start-line"></div>
    <div class="trial-floor"></div>
    <div class="trial-strip" id="trial-strip"><img src="__IMG:flat-strip__" alt="平纸条"></div>
    <div class="trial-rotor" id="trial-rotor"><img src="__IMG:paper-rotor__" alt="两翼展开的纸蜻蜓"></div>
    <div class="trial-label">本次图示</div>
  </div>
  <div class="trial-panel" id="trial-panel">
    <h2 id="trial-prompt">先找一样高的起点</h2>
    <button class="btn ghost" type="button" id="trial-watch" aria-label="重看这一次下落">重看这次</button>
    <div class="trial-options" id="trial-options">
      <button type="button" id="trial-option-a"></button>
      <button type="button" id="trial-option-b"></button>
    </div>
    <button class="btn green" type="button" id="trial-release" aria-label="同时松手，观看试飞">一起松手</button>
    <div class="trial-record" id="trial-record" aria-label="已经记录的观察"></div>
  </div>
</section>
