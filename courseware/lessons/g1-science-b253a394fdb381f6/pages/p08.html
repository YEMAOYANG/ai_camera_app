<section class="wind-scene">
  <div class="wind-field"><img id="wind-background" src="__IMG:outdoor__" alt="有大人陪同的户外泡泡观察场景"></div>
  <div id="wind-ribbon" class="wind-direction" data-semantic-diagram="观察到的风向箭头" aria-label="这次风向右"><span aria-hidden="true">→</span></div>
  <button id="wind-left" class="wind-window left-window" data-direction="left" aria-label="左边的观察窗"><span aria-hidden="true">←</span></button>
  <button id="wind-right" class="wind-window right-window" data-direction="right" aria-label="右边的观察窗"><span aria-hidden="true">→</span></button>
  <button id="wind-bubble" class="wind-bubble" aria-label="先选择泡泡，再送到观察窗"><img src="__IMG:bubble__" alt="能移动的透明泡泡"></button>
  <div id="wind-path" class="wind-path" hidden data-semantic-diagram="本次泡泡随风移动的方向"></div>
  <button id="wind-reset" class="btn ghost wind-reset" aria-label="重新看风向">↺</button>
</section>
