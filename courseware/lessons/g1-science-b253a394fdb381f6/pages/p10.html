<section class="tool-scene">
  <div id="tool-bank" class="tool-bank">
    <button id="tool-circle" class="tool-card" data-tool="circle" aria-label="圆形工具"><img src="__IMG:circle-tool__" alt="圆环吹泡泡棒"></button>
    <button id="tool-heart" class="tool-card" data-tool="heart" aria-label="心形工具"><img src="__IMG:heart-tool__" alt="心形吹泡泡棒"></button>
    <button id="tool-star" class="tool-card" data-tool="star" aria-label="星形工具"><img src="__IMG:star-tool__" alt="星形吹泡泡棒"></button>
  </div>
  <button id="tool-dish" class="tool-dish" aria-label="把工具送到泡泡液盘"><img src="__IMG:water__" alt="泡泡液盘"><img id="tool-current" class="tool-current" alt="已放入的工具" hidden></button>
  <button id="tool-blow" class="btn blue tool-blow" aria-label="吹气，看看离开工具的泡泡">≈ 吹气</button>
  <div id="tool-result" class="tool-result" aria-label="空中独立泡泡的观察窗"><img src="__IMG:bubble__" alt="离开工具的独立球形泡泡" hidden></div>
  <div id="tool-shapes" class="tool-shapes" aria-label="选择刚才看到的泡泡形状">
    <button id="tool-shape-rectangle" class="shape-option" data-shape="rectangle" aria-label="长方体形泡泡"><img src="__IMG:rect-bubble__" alt="长方体形的想象泡泡"></button>
    <button id="tool-shape-sphere" class="shape-option" data-shape="sphere" aria-label="球形泡泡"><img src="__IMG:bubble__" alt="球形泡泡"></button>
    <button id="tool-shape-triangle" class="shape-option" data-shape="triangle" aria-label="三角形泡泡"><img src="__IMG:tri-bubble__" alt="三角形的想象泡泡"></button>
  </div>
  <div id="tool-records" class="tool-records" aria-label="三种工具的比较记录"><i data-record="circle"></i><i data-record="heart"></i><i data-record="star"></i></div>
</section>
