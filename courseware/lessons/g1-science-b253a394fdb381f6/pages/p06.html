<section class="nest-scene">
  <div id="nest-table" class="nest-table" role="button" tabindex="0" aria-label="台面">
    <img class="nest-background" src="__IMG:table__" alt="泡泡实验桌">
    <div id="nest-moisture" class="nest-moisture" hidden data-semantic-diagram="湿润台面区域"></div>
    <div id="nest-outer" class="nest-outer" hidden data-semantic-diagram="贴在台面的外泡半球"><img src="__IMG:bubble__" alt="大泡泡"></div>
    <div id="nest-inner" class="nest-inner" hidden data-semantic-diagram="外泡里面的小半球"><img src="__IMG:bubble__" alt="里面的小泡泡"></div>
    <img id="nest-inserted-straw" class="nest-inserted-straw" src="__IMG:wet-straw__" alt="已经轻轻送进大泡的吸管" hidden>
    <button id="nest-center" class="nest-target" aria-label="大泡泡中间的位置"></button>
    <button id="nest-edge" class="nest-edge" aria-label="大泡泡边缘的位置"></button>
  </div>
  <div id="nest-bank" class="nest-bank">
    <button id="nest-water" class="nest-card" data-piece="water" aria-label="用水润湿台面"><img src="__IMG:water__" alt="一碗水"></button>
    <button id="nest-wet-straw" class="nest-card" data-piece="straw" aria-label="轻轻穿入的吸管"><img src="__IMG:wet-straw__" alt="透明吸管"></button>
  </div>
  <button id="nest-large" class="nest-blow large-blow" aria-label="吹一个大泡泡"><img src="__IMG:bubble__" alt="大泡吹气图"><span aria-hidden="true">≈</span></button>
  <button id="nest-small" class="nest-blow small-blow" aria-label="在里面轻轻吹小泡泡"><img src="__IMG:bubble__" alt="小泡吹气图"><span aria-hidden="true">≈</span></button>
  <div class="nest-flow" aria-hidden="true" data-semantic-diagram="湿润到大泡到吸管到小泡的四步进度"><i></i><b>→</b><i></i><b>→</b><i></i><b>→</b><i></i></div>
</section>
