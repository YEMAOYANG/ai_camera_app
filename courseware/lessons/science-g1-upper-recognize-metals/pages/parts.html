<section id="parts-board" aria-label="物品观察图">
  <img id="parts-image" src="__IMG:chair__" alt="有蓝色座面和金属腿的椅子">
  <button id="parts-upper" class="part-target" aria-label="观察蓝色座面"></button>
  <button id="parts-lower" class="part-target" aria-label="观察金属腿"></button>
</section>
<section id="parts-card" aria-label="部位记录卡">
  <h2>部位记录卡</h2>
  <div id="parts-slot">
    <svg viewBox="0 0 120 120" aria-hidden="true" data-semantic-diagram><path d="M15 60h58M50 39l23 21-23 21M77 29h24v62H77" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div id="parts-saved" class="hide"><img id="parts-result" src="__IMG:chair__" alt=""><span id="parts-marker" aria-hidden="true"></span></div>
  </div>
  <p id="parts-label">把找到的部位记在这里</p>
</section>
<button id="parts-retry" class="btn hide" aria-label="重试载入观察图">重试图片</button>
