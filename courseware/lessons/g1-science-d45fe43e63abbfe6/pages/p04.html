<div class="activity-heading"><h2>看行动，把过程接起来</h2><button class="listen" id="process-listen" aria-label="重听这次活动的目标"><svg class="control-mark" width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor"/><path d="M16 8c2.7 2.2 2.7 5.8 0 8m3-10c4 3.4 4 8.6 0 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="control-label">重听目标</span></button></div>
<div class="scene-panel" id="process-stage"><img id="process-stage-image" src="__IMG:plan-flag__" alt="等待开始的纸旗制作材料"></div>
<div id="process-track"><div class="process-slot" id="process-slot-0" data-hit="first-action"><b>1</b><div class="slot-image"></div></div><div class="process-slot" id="process-slot-1" data-hit="second-action"><b>2</b><div class="slot-image"></div></div><div class="process-slot" id="process-slot-2" data-hit="third-action"><b>3</b><div class="slot-image"></div></div></div>
