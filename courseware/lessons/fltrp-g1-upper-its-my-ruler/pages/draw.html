<section class="workshop" id="draw-board">
  <button class="btn replay" id="draw-repeat" aria-label="再听问答">▶</button>
  <div class="draw-cards" id="draw-cards" aria-label="文具图卡"></div>
  <canvas class="display drawing" id="draw-canvas" width="640" height="320" aria-label="自由画板"></canvas>
  <button class="btn draw-next" id="draw-next" aria-label="传画换角色">➜</button>
  <button class="btn draw-reset" id="draw-clear" data-activity-reset aria-label="重画">↺</button>
</section>
