<div id="assembly-toolbar">
  <button type="button" id="assembly-sound" class="btn blue" aria-label="重听安装口令">听一听</button>
  <button type="button" id="assembly-next" class="btn green" hidden>继续 →</button>
</div>
<div id="assembly-table">
  <div id="model-pieces" aria-label="六块部件图卡">
    <button type="button" class="assembly-piece" data-part="hand-l"><img src="__IMG:hand-l__" alt="屏幕左边的手"></button>
    <button type="button" class="assembly-piece" data-part="hand-r"><img src="__IMG:hand-r__" alt="屏幕右边的手"></button>
    <button type="button" class="assembly-piece" data-part="leg-l"><img src="__IMG:leg-l__" alt="屏幕左边的腿"></button>
    <button type="button" class="assembly-piece" data-part="leg-r"><img src="__IMG:leg-r__" alt="屏幕右边的腿"></button>
    <button type="button" class="assembly-piece" data-part="foot-l"><img src="__IMG:foot-l__" alt="屏幕左边的脚"></button>
    <button type="button" class="assembly-piece" data-part="foot-r"><img src="__IMG:foot-r__" alt="屏幕右边的脚"></button>
  </div>
  <div id="model-docks" aria-label="模型及六个安装位置">
    <img id="model-shell" src="__IMG:model-shell__" alt="等待装上手、腿和脚的纸板模型">
    <div class="assembly-dock" data-dock="hand-l"><img hidden alt=""></div>
    <div class="assembly-dock" data-dock="hand-r"><img hidden alt=""></div>
    <div class="assembly-dock" data-dock="leg-l"><img hidden alt=""></div>
    <div class="assembly-dock" data-dock="leg-r"><img hidden alt=""></div>
    <div class="assembly-dock" data-dock="foot-l"><img hidden alt=""></div>
    <div class="assembly-dock" data-dock="foot-r"><img hidden alt=""></div>
  </div>
</div>
