<div id="delivery-toolbar">
  <button type="button" id="delivery-sound" class="btn blue" aria-label="重听老师的句子">听一听</button>
  <button type="button" id="delivery-next" class="btn green" hidden>继续 →</button>
</div>
<div id="delivery-table">
  <div id="delivery-choices" aria-label="四张部位图卡">
    <button type="button" class="delivery-card" data-card="one-ear"><img src="__IMG:one-ear__" alt="圈一只耳朵"></button>
    <button type="button" class="delivery-card" data-card="two-ears"><img src="__IMG:two-ears__" alt="圈两只耳朵"></button>
    <button type="button" class="delivery-card" data-card="one-foot"><img src="__IMG:one-foot__" alt="圈一只脚"></button>
    <button type="button" class="delivery-card" data-card="two-feet"><img src="__IMG:two-feet__" alt="圈两只脚"></button>
  </div>
  <div id="delivery-slot" aria-label="展示收到的卡片"><img id="delivered-image" hidden alt=""></div>
</div>
