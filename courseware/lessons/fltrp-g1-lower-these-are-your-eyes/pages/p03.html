<div id="count-room">
  <aside id="baby-picture"><img src="__IMG:baby-pair__" alt="一个大人和一个小宝宝"></aside>
  <section id="count-console">
    <div id="count-toolbar">
      <button type="button" id="count-sound" class="btn blue" aria-label="重听老师的问题">听一听</button>
      <output id="count-total" aria-live="polite">0</output>
      <button type="button" id="count-end" class="btn green" hidden>完成 →</button>

    <div id="eye-panel" data-semantic-diagram="八只眼按两排四列排布，逐个点亮，已点过的不重计" aria-label="八只眼灯板"></div>
  </section>
</div>
