<div id="demo-panel" aria-label="老师用白猫示范">
  <div class="demo-heading">老师示范</div>
  <img id="demo-cat" src="__IMG:cat-white__" alt="老师示范的白猫">
  <div id="demo-mat"></div>
</div>
<h2 id="colour-prompt">An orange cat.</h2>
<div id="colour-choices">
  <button class="cat-choice" data-colour="white" aria-label="白色小猫"><img src="__IMG:cat-white__" alt="白色小猫"></button>
  <button class="cat-choice" data-colour="black" aria-label="黑色小猫"><img src="__IMG:cat-black__" alt="黑色小猫"></button>
  <button class="cat-choice" data-colour="orange" aria-label="橙色小猫"><img src="__IMG:cat-orange__" alt="橙色小猫"></button>
</div>
<div id="found-mat" aria-label="找到的小猫会来到这里"></div>
<div id="image-recovery" class="hide"><p>图片暂未加载</p><button class="btn" id="retry-pictures">重新加载图片</button></div>
