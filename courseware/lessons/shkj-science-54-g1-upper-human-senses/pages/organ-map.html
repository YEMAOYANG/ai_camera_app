<div class="anatomy">
  <section class="body-frame" aria-label="人体位置图">
    <img src="__IMG:body-model__" alt="老师正面图，能看到眼睛、耳朵、鼻子和前臂" draggable="false">
    <svg class="anatomy-leaders" viewBox="0 0 584 534" aria-hidden="true" pointer-events="none">
      <path d="M117 88 L254 86 M470 84 L333 94 M111 200 L287 107 M488 236 L285 126 M112 376 L177 335"/>
      <circle cx="254" cy="86" r="4"/><circle cx="333" cy="94" r="4"/><circle cx="287" cy="107" r="4"/><circle cx="285" cy="126" r="4"/><circle cx="177" cy="335" r="4"/>
    </svg>
    <button id="point-eye" class="target" data-part="eye" aria-label="眼睛的位置"></button>
    <button id="point-ear" class="target" data-part="ear" aria-label="耳朵的位置"></button>
    <button id="point-nose" class="target" data-part="nose" aria-label="鼻子的位置"></button>
    <button id="point-skin" class="target" data-part="skin" aria-label="前臂皮肤的位置"></button>
    <button id="point-tongue" class="target mouth-model" data-part="tongue" aria-label="口腔模型里舌头的位置"><img src="__IMG:organ-tongue__" alt="口腔模型中的舌头" draggable="false"></button>
  </section>
  <section class="part-frame" aria-label="感官图卡">
    <button class="part" data-part="eye" aria-label="眼睛图卡"><img src="__IMG:organ-eye__" alt="眼睛" draggable="false"></button>
    <button class="part" data-part="ear" aria-label="耳朵图卡"><img src="__IMG:organ-ear__" alt="耳朵" draggable="false"></button>
    <button class="part" data-part="nose" aria-label="鼻子图卡"><img src="__IMG:organ-nose__" alt="鼻子" draggable="false"></button>
    <button class="part" data-part="tongue" aria-label="舌头图卡"><img src="__IMG:organ-tongue__" alt="舌头" draggable="false"></button>
    <button class="part" data-part="skin" aria-label="皮肤图卡"><img src="__IMG:organ-skin__" alt="前臂和手背的皮肤" draggable="false"></button>
  </section>
</div>
