<div class="orange-route">
  <section class="station" aria-label="观察操作台">
    <img id="observed-photo" src="__IMG:orange-outside__" alt="观察的橘子" draggable="false">
    <div id="observation-slot" class="record-zone" aria-label="把图卡拖到观察册" data-hit>
      <img src="__IMG:observation-journal__" alt="观察册" draggable="false">
    </div>
  </section>
  <section class="record-stack" aria-label="观察记录图卡">
    <button class="record-card" data-observation="inside" aria-label="剥开的橘子"><img src="__IMG:orange-inside__" alt="剥开后能看到橘瓣" draggable="false"></button>
    <button class="record-card" data-observation="outside" aria-label="完整橘子"><img src="__IMG:orange-outside__" alt="完整橘子的外皮" draggable="false"></button>
    <div class="posted-record" id="record-1" aria-label="第一条记录"></div>
    <div class="posted-record" id="record-2" aria-label="第二条记录"></div>
  </section>
</div>
