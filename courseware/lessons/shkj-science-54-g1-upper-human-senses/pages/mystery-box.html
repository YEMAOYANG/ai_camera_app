<div class="mystery">
  <section class="box-stage" aria-label="观察盒和线索">
    <button id="box-open" aria-label="打开观察盒" disabled><img src="__IMG:closed-box__" alt="有盖的观察盒" draggable="false"></button>
    <div class="clues">
      <div id="shape-clue" data-semantic-diagram="方形平面轮廓说明物体有平面" class="clue-card"><div class="shape-clue"></div></div>
      <div id="texture-clue" data-semantic-diagram="压痕表示按下时能改变形状" class="clue-card"><div class="pressed-clue"></div></div>
    </div>
  </section>
  <section class="mystery-options" aria-label="图卡选择">
    <div id="sense-choices" class="options-grid senses">
      <button data-sense="skin" aria-label="皮肤"><img src="__IMG:organ-skin__" alt="皮肤" draggable="false"></button>
      <button data-sense="ear" aria-label="耳朵"><img src="__IMG:organ-ear__" alt="耳朵" draggable="false"></button>
      <button data-sense="eye" aria-label="眼睛"><img src="__IMG:organ-eye__" alt="眼睛" draggable="false"></button>
    </div>
    <div id="object-choices" class="options-grid objects hide">
      <button data-object="wood" aria-label="方形木块"><img src="__IMG:box-wood-block__" alt="方形木块" draggable="false"></button>
      <button data-object="ball" aria-label="圆球"><img src="__IMG:box-ball__" alt="圆球" draggable="false"></button>
      <button data-object="foam" aria-label="方形海绵"><img src="__IMG:box-foam-block__" alt="方形海绵" draggable="false"></button>
    </div>
  </section>
</div>
