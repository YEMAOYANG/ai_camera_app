<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mira Guardian 家长端 App 高保真原型</title>
    <meta
      name="description"
      content="Mira Guardian 家长端 App HTML 高保真原型，覆盖页面、状态、弹层和关键交互反馈。"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "PingFang SC",
                "HarmonyOS Sans",
                "MiSans",
                "Inter",
                "system-ui",
                "sans-serif",
              ],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">跳到原型内容</a>
    <div class="prototype-shell">
      <section class="phone-frame" aria-label="Mira Guardian App 原型">
        <div class="phone-chrome" aria-hidden="true">
          <span>19:42</span>
          <span class="chrome-dots"><i></i><i></i><i></i></span>
        </div>
        <main id="app" class="app-scroll" tabindex="-1"></main>
        <nav id="tabbar" class="bottom-tabbar" aria-label="底部导航"></nav>
      </section>

      <aside class="control-panel" aria-label="原型控制台">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Mira Guardian</p>
            <h1>页面与状态控制台</h1>
          </div>
          <button class="icon-button" type="button" data-go="coverage" title="查看覆盖说明">
            <i data-lucide="list-checks"></i>
          </button>
        </div>

        <section class="panel-block">
          <div class="panel-block-title">
            <span>当前状态</span>
            <button type="button" class="text-button" data-state="default">重置</button>
          </div>
          <div id="stateChips" class="state-chip-grid"></div>
        </section>

        <section class="panel-block">
          <div class="panel-block-title">
            <span>页面清单</span>
            <span id="pageCount" class="panel-count"></span>
          </div>
          <div class="search-row">
            <i data-lucide="search"></i>
            <input id="pageSearch" type="search" placeholder="搜索页面、状态、模块" autocomplete="off" />
          </div>
          <div id="pageMap" class="page-map"></div>
        </section>

        <section class="panel-block">
          <div class="panel-block-title">
            <span>关键弹层</span>
            <span id="sheetCount" class="panel-count"></span>
          </div>
          <div id="sheetMap" class="sheet-map"></div>
        </section>
      </aside>
    </div>

    <div id="sheetRoot"></div>
    <div id="modalRoot"></div>
    <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
