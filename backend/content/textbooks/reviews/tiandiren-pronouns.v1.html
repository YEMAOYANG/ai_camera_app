<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>称呼变一变</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbf8ef;color:#214c40;font-family:system-ui,"PingFang SC",sans-serif}
main{max-width:950px;margin:auto;padding:22px}h1{font-size:30px;margin:0 0 8px}p{line-height:1.6;margin:8px 0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}button{font:inherit;color:inherit;cursor:pointer;border:2px solid #cdded4;background:white;border-radius:14px;padding:10px 18px;min-height:46px}
button:focus-visible{outline:3px solid #dc7b2a;outline-offset:3px}button[aria-pressed=true]{background:#214c40;color:white;border-color:#214c40}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.person{display:flex;flex-direction:column;align-items:center;position:relative;gap:5px;padding:12px 4px}.person svg{width:100px;height:115px;max-width:100%}.name{font-size:22px}.role{font-size:36px;font-weight:700;min-height:50px}
.speaker{position:absolute;top:8px;right:8px;font-size:12px;background:#fae0a5;color:#4d3b0e;padding:4px 8px;border-radius:8px}
.question{font-size:23px;font-weight:650}.feedback{min-height:56px;background:#edf3eb;border-left:4px solid #67927a;padding:12px 16px;margin-top:14px;border-radius:8px}
.reset{margin-left:auto;background:transparent}.hint{color:#587268;font-size:15px}@media(max-width:500px){main{padding:14px}.people{gap:7px}.person svg{height:86px}.name{font-size:18px}button{padding:8px 12px}h1{font-size:26px}.question{font-size:20px}}
</style>
<main>
<h1>称呼变一变</h1><p id="situation">女生正在对男生说话。</p>
<div class="tools" aria-label="选择说话的人"><button id="girlSpeak" aria-pressed="true">女生说</button><button id="boySpeak" aria-pressed="false">男生说</button><button class="reset" id="reset">重置</button></div>
<div class="people">
<button class="person" id="girl" aria-label="选择女生"><span class="speaker" id="girlBadge">说话的人</span><svg viewBox="0 0 100 115" aria-hidden="true"><path d="M21 45Q15 6 50 5Q87 8 79 49L74 80H24Z" fill="#51473e"/><circle cx="50" cy="36" r="24" fill="#f4c7a4"/><path d="M26 27Q26 6 50 8Q71 8 75 30L57 17L44 30Z" fill="#51473e"/><circle cx="42" cy="37" r="2" fill="#333"/><circle cx="58" cy="37" r="2" fill="#333"/><path d="M44 47Q50 52 57 47" fill="none" stroke="#a36752" stroke-width="2"/><path d="M16 111L22 79Q26 63 50 63Q75 64 79 81L85 111" fill="#cf795d"/></svg><span class="name">女生</span><span class="role" id="girlRole">？</span></button>
<button class="person" id="boy" aria-label="选择男生"><span class="speaker" id="boyBadge" hidden>说话的人</span><svg viewBox="0 0 100 115" aria-hidden="true"><circle cx="50" cy="36" r="25" fill="#f4c7a4"/><path d="M25 32Q19 4 50 6Q83 4 76 35L65 21L54 24L47 18L29 32" fill="#51473e"/><circle cx="42" cy="38" r="2" fill="#333"/><circle cx="58" cy="38" r="2" fill="#333"/><path d="M44 48Q50 52 57 48" fill="none" stroke="#a36752" stroke-width="2"/><path d="M15 111L22 78Q27 63 50 63Q76 63 80 81L85 111" fill="#68999d"/></svg><span class="name">男生</span><span class="role" id="boyRole">？</span></button>
<button class="person" id="third" aria-label="选择旁边的男孩"><svg viewBox="0 0 100 115" aria-hidden="true"><circle cx="50" cy="36" r="25" fill="#ebbb92"/><path d="M25 28Q23 3 52 6Q79 5 77 31L65 19L55 25L47 20L28 32" fill="#403e38"/><circle cx="42" cy="38" r="2" fill="#333"/><circle cx="58" cy="38" r="2" fill="#333"/><path d="M44 48Q50 52 57 48" fill="none" stroke="#9a6751" stroke-width="2"/><path d="M15 111L22 78Q27 63 50 63Q76 63 80 81L85 111" fill="#d6aa51"/></svg><span class="name">旁边的男孩</span><span class="role" id="thirdRole">？</span></button>
</div>
<div class="tools" aria-label="选择要找的称呼"><button id="findMe" aria-pressed="false">找“我”</button><button id="findYou" aria-pressed="true">找“你”</button><button id="findHim" aria-pressed="false">找“他”</button></div>
<p class="question" id="question">谁是女生口中的“你”？点一点。</p><div class="feedback" id="feedback" role="status" aria-live="polite">先看谁在说话，再点击一位小朋友。</div>
<p class="hint">说话的人称自己为“我”，称对话的人为“你”，提到旁边的男孩时用“他”。</p>
</main>
<script>
let speaker='girl',target='你';
const $=id=>document.getElementById(id);
function roles(){return {girl:speaker==='girl'?'我':'你',boy:speaker==='boy'?'我':'你',third:'他'}}
function render(){
 const name=speaker==='girl'?'女生':'男生';
 $('situation').textContent=name+'正在对'+(speaker==='girl'?'男生':'女生')+'说话。';
 $('question').textContent='谁是'+name+'口中的“'+target+'”？点一点。';
 $('girlSpeak').setAttribute('aria-pressed',String(speaker==='girl'));
 $('boySpeak').setAttribute('aria-pressed',String(speaker==='boy'));
 $('girlBadge').hidden=speaker!=='girl';$('boyBadge').hidden=speaker!=='boy';
 for(const [id,label] of [['findMe','我'],['findYou','你'],['findHim','他']])$(id).setAttribute('aria-pressed',String(target===label));
 for(const id of ['girl','boy','third'])$(id+'Role').textContent='？';
 $('feedback').textContent='先看谁在说话，再点击一位小朋友。';
}
function choose(id){
 const map=roles();
 if(map[id]!==target){$('feedback').textContent=target==='我'?'“我”是说话的人自己。再试一次。':target==='你'?'“你”是正在与说话者对话的人。再试一次。':'“他”是对话中提到的旁边那位男孩。再试一次。';return}
 for(const person of ['girl','boy','third'])$(person+'Role').textContent=map[person];
 $('feedback').textContent='选对了！'+(speaker==='girl'?'女生':'男生')+'称自己为“我”，称'+(speaker==='girl'?'男生':'女生')+'为“你”，称旁边的男孩为“他”。';
}
$('girlSpeak').onclick=()=>{speaker='girl';render()};$('boySpeak').onclick=()=>{speaker='boy';render()};
for(const id of ['girl','boy','third'])$(id).onclick=()=>choose(id);
for(const [id,label] of [['findMe','我'],['findYou','你'],['findHim','他']])$(id).onclick=()=>{target=label;render()};
$('reset').onclick=()=>{speaker='girl';target='你';render()};render();
</script></html>
