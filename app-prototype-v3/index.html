<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mira Guardian v3 高保真 App 原型</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --bg-dark: #050505;
      --bg-dark-2: #0b0b0b;
      --surface-dark: #121212;
      --surface-dark-2: #1b1b1b;
      --line-dark: #242424;
      --ink-dark: #ffffff;
      --muted-dark: #9a9a9a;
      --bg-light: #f5f5f5;
      --bg-light-2: #f7f7f7;
      --surface-light: #ffffff;
      --surface-light-2: #eeeeee;
      --line-light: #e5e5e5;
      --ink-light: #111111;
      --muted-light: #666666;
      --blue: #66a3ff;
      --blue-deep: #1c64f2;
      --success: #2fbe71;
      --warning: #d99a24;
      --danger: #e5484d;
      --radius-card: 8px;
      --radius-control: 8px;
      --radius-sheet: 24px;
      --shadow-compact: 0 8px 18px rgba(0,0,0,.18);
      --dur-1: 140ms;
      --dur-2: 220ms;
      --dur-3: 320ms;
      --ease-out: cubic-bezier(.16,1,.3,1);
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "HarmonyOS Sans", "MiSans", "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: #101010;
      color: var(--ink-dark);
      font-family: var(--font-sans);
      letter-spacing: 0;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select, textarea {
      font: inherit;
      letter-spacing: 0;
    }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }
    .app-shell {
      position: relative;
      min-height: 100dvh;
      height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--ink-dark);
    }
    .app-shell.light {
      background: var(--bg-light);
      color: var(--ink-light);
    }
    .app-scroll {
      min-height: 100dvh;
      height: 100%;
      overflow-y: auto;
      padding: calc(16px + env(safe-area-inset-top)) 18px 118px;
      scrollbar-width: none;
    }
    .app-scroll::-webkit-scrollbar { display: none; }
    .screen {
      min-height: calc(100dvh - 136px);
      animation: pageIn var(--dur-3) var(--ease-out);
    }
    @keyframes pageIn {
      from { opacity: .72; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 46px;
      margin-bottom: 16px;
    }
    .topbar-title {
      min-width: 0;
    }
    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted-dark);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.2;
    }
    .light .eyebrow { color: var(--muted-light); }
    h1, h2, h3, p { margin: 0; }
    h1 {
      color: inherit;
      font-size: 32px;
      line-height: 1.06;
      font-weight: 760;
      text-wrap: balance;
    }
    h2 {
      font-size: 24px;
      line-height: 1.14;
      font-weight: 740;
      text-wrap: balance;
    }
    h3 {
      font-size: 17px;
      line-height: 1.2;
      font-weight: 720;
    }
    .copy {
      color: var(--muted-dark);
      font-size: 14px;
      line-height: 1.56;
      text-wrap: pretty;
    }
    .light .copy { color: var(--muted-light); }
    .icon {
      width: 20px;
      height: 20px;
      display: inline-block;
      flex: 0 0 auto;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .icon-button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      color: var(--ink-dark);
    }
    .light .icon-button {
      background: #fff;
      color: var(--ink-light);
    }
    .hero-image {
      position: relative;
      min-height: 280px;
      overflow: hidden;
      border-radius: var(--radius-card);
      background: #111;
    }
    .hero-image.small { min-height: 210px; }
    .hero-image img {
      display: block;
      width: 100%;
      height: 100%;
      min-height: inherit;
      object-fit: cover;
    }
    .hero-image::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.64));
      pointer-events: none;
    }
    .hero-overlay {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 1;
      display: grid;
      gap: 10px;
    }
    .panel {
      border-radius: var(--radius-card);
      background: var(--surface-dark);
      border: 1px solid var(--line-dark);
      padding: 16px;
    }
    .light .panel {
      background: var(--surface-light);
      border-color: var(--line-light);
    }
    .panel.flat {
      border: 0;
      background: var(--surface-dark-2);
    }
    .light .panel.flat { background: var(--surface-light); }
    .panel.invert {
      background: #fff;
      color: #111;
      border-color: #fff;
    }
    .section-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin: 20px 0 10px;
    }
    .section-title p {
      margin-top: 5px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .metric {
      min-height: 78px;
      border-radius: var(--radius-card);
      background: rgba(255,255,255,.08);
      padding: 12px;
    }
    .light .metric { background: var(--surface-light-2); }
    .metric strong {
      display: block;
      font-size: 24px;
      line-height: 1;
      font-weight: 780;
      font-variant-numeric: tabular-nums;
    }
    .metric span {
      display: block;
      margin-top: 8px;
      color: var(--muted-dark);
      font-size: 12px;
      font-weight: 650;
    }
    .light .metric span { color: var(--muted-light); }
    .chip-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      border-radius: 999px;
      padding: 0 10px;
      background: rgba(255,255,255,.08);
      color: var(--ink-dark);
      font-size: 12px;
      font-weight: 680;
      white-space: nowrap;
    }
    .light .chip {
      background: var(--surface-light-2);
      color: var(--ink-light);
    }
    .chip.success { color: var(--success); }
    .chip.warning { color: var(--warning); }
    .chip.danger { color: var(--danger); }
    .chip.info { color: var(--blue); }
    .list {
      display: grid;
      gap: 8px;
    }
    .list-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 64px;
      padding: 12px;
      border: 0;
      border-radius: var(--radius-card);
      background: var(--surface-dark);
      color: inherit;
      text-align: left;
    }
    .light .list-row { background: var(--surface-light); }
    .list-row .row-icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-card);
      background: rgba(255,255,255,.08);
      color: var(--ink-dark);
    }
    .light .list-row .row-icon {
      background: var(--surface-light-2);
      color: var(--ink-light);
    }
    .row-main { min-width: 0; }
    .row-title {
      font-size: 15px;
      line-height: 1.2;
      font-weight: 720;
      color: inherit;
    }
    .row-desc {
      margin-top: 5px;
      color: var(--muted-dark);
      font-size: 12px;
      line-height: 1.38;
    }
    .light .row-desc { color: var(--muted-light); }
    .row-right {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted-dark);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .light .row-right { color: var(--muted-light); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      border: 0;
      border-radius: var(--radius-control);
      padding: 0 16px;
      font-size: 14px;
      font-weight: 740;
      text-align: center;
      transition: transform var(--dur-1) var(--ease-out), opacity var(--dur-1) var(--ease-out), background var(--dur-1) var(--ease-out);
    }
    .btn:active { transform: scale(.98); }
    .btn.primary {
      background: #fff;
      color: #050505;
    }
    .light .btn.primary {
      background: #111;
      color: #fff;
    }
    .btn.secondary {
      background: rgba(255,255,255,.1);
      color: var(--ink-dark);
    }
    .light .btn.secondary {
      background: var(--surface-light-2);
      color: var(--ink-light);
    }
    .btn.danger {
      background: rgba(229,72,77,.12);
      color: var(--danger);
    }
    .btn.block { width: 100%; }
    .field {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }
    .field label {
      font-size: 13px;
      font-weight: 720;
      color: inherit;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: var(--radius-control);
      background: var(--surface-light-2);
      color: var(--ink-light);
      padding: 0 14px;
      outline: none;
    }
    .field textarea {
      min-height: 112px;
      padding: 14px;
      resize: none;
      line-height: 1.5;
    }
    .field .error {
      color: var(--danger);
      font-size: 12px;
      font-weight: 650;
      display: none;
    }
    .has-error .error { display: block; }
    .has-error input { box-shadow: inset 0 0 0 1px var(--danger); }
    .shake { animation: shake var(--dur-3) var(--ease-out); }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-7px); }
      45% { transform: translateX(6px); }
      70% { transform: translateX(-3px); }
    }
    .timeline {
      position: relative;
      display: grid;
      gap: 10px;
    }
    .timeline-item {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: start;
      gap: 10px;
      min-height: 56px;
    }
    .timeline-dot {
      width: 12px;
      height: 12px;
      margin: 5px auto 0;
      border-radius: 50%;
      background: var(--line-dark);
      box-shadow: 0 0 0 6px rgba(255,255,255,.04);
    }
    .timeline-dot.on { background: var(--success); }
    .timeline-dot.warn { background: var(--warning); }
    .timeline-dot.danger { background: var(--danger); }
    .light .timeline-dot { background: #d7d7d7; box-shadow: 0 0 0 6px rgba(0,0,0,.04); }
    .segmented {
      display: flex;
      gap: 6px;
      padding: 4px;
      border-radius: var(--radius-control);
      background: rgba(255,255,255,.08);
    }
    .light .segmented { background: var(--surface-light-2); }
    .segmented button {
      flex: 1;
      min-height: 36px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: inherit;
      font-size: 12px;
      font-weight: 740;
    }
    .segmented button.active {
      background: #fff;
      color: #111;
    }
    .light .segmented button.active {
      background: #111;
      color: #fff;
    }
    .tabbar {
      position: fixed;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 30;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: 1fr 1fr 62px 1fr 1fr;
      align-items: center;
      width: min(398px, calc(100vw - 22px));
      height: 74px;
      border-radius: 24px;
      background: rgba(255,255,255,.96);
      color: #111;
      padding: 8px 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.22);
    }
    .tabbar.hidden { display: none; }
    .nav-btn {
      display: grid;
      place-items: center;
      gap: 3px;
      min-height: 56px;
      border: 0;
      border-radius: 18px;
      background: transparent;
      color: #777;
      font-size: 11px;
      font-weight: 720;
    }
    .nav-btn.active {
      color: #111;
      background: #f1f1f1;
    }
    .main-fab {
      position: relative;
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin: -24px auto 0;
      border: 0;
      border-radius: 50%;
      background: #111;
      color: #fff;
      box-shadow: 0 8px 18px rgba(0,0,0,.32);
      transition: transform var(--dur-2) var(--ease-out);
    }
    .main-fab.open { transform: scale(1.05) rotate(45deg); }
    .quick-actions {
      position: fixed;
      left: 50%;
      bottom: 96px;
      z-index: 29;
      transform: translateX(-50%);
      display: none;
      width: min(350px, calc(100vw - 56px));
      gap: 8px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .quick-actions.open { display: grid; animation: sheetUp var(--dur-2) var(--ease-out); }
    .quick-actions button {
      min-height: 48px;
      border: 0;
      border-radius: var(--radius-control);
      background: #fff;
      color: #111;
      font-size: 12px;
      font-weight: 760;
      box-shadow: var(--shadow-compact);
    }
    .sheet {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0,0,0,.62);
      padding: 0 10px max(10px, env(safe-area-inset-bottom));
    }
    .sheet.open { display: flex; }
    .sheet-panel {
      width: min(410px, 100%);
      max-height: min(78dvh, 680px);
      overflow-y: auto;
      border-radius: var(--radius-sheet) var(--radius-sheet) 18px 18px;
      background: #fff;
      color: #111;
      padding: 12px 16px 18px;
      animation: sheetUp var(--dur-3) var(--ease-out);
    }
    @keyframes sheetUp {
      from { opacity: .88; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .grabber {
      width: 42px;
      height: 4px;
      margin: 0 auto 14px;
      border-radius: 999px;
      background: #d5d5d5;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 102px;
      z-index: 80;
      transform: translate(-50%, 16px);
      opacity: 0;
      pointer-events: none;
      max-width: min(344px, calc(100vw - 44px));
      border-radius: 999px;
      background: #fff;
      color: #111;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 720;
      box-shadow: 0 10px 24px rgba(0,0,0,.24);
      transition: opacity var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out);
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .guide {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      background: rgba(0,0,0,.74);
      padding: 0 24px 110px;
      align-items: flex-end;
    }
    .guide.open { display: flex; }
    .guide-card {
      position: relative;
      width: min(382px, 100%);
      margin: 0 auto;
      border-radius: 24px;
      background: #fff;
      color: #111;
      padding: 22px;
      animation: sheetUp var(--dur-3) var(--ease-out);
    }
    .guide-card::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -28px;
      width: 1px;
      height: 28px;
      border-left: 1px dashed #fff;
    }
    .guide-arrow {
      position: fixed;
      left: 50%;
      bottom: 84px;
      width: 18px;
      height: 18px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: translateX(-50%) rotate(45deg);
    }
    .skeleton {
      overflow: hidden;
      position: relative;
      min-height: 18px;
      border-radius: 6px;
      background: rgba(255,255,255,.12);
    }
    .light .skeleton { background: #e6e6e6; }
    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }
    .pulse {
      position: relative;
    }
    .pulse::after {
      content: "";
      position: absolute;
      inset: -4px;
      border: 1px solid currentColor;
      border-radius: inherit;
      opacity: .35;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      from { transform: scale(.9); opacity: .4; }
      to { transform: scale(1.35); opacity: 0; }
    }
    .state-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .state-strip button {
      min-height: 42px;
      border: 0;
      border-radius: var(--radius-control);
      background: rgba(255,255,255,.08);
      color: inherit;
      font-size: 11px;
      font-weight: 720;
    }
    .light .state-strip button { background: var(--surface-light-2); }

    .onboard-shell,
    .setup-shell {
      min-height: calc(100dvh - 150px);
      display: grid;
      gap: 16px;
      align-content: start;
    }
    .onboard-head,
    .setup-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
    }
    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      font-weight: 760;
    }
    .brand-dot {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #fff;
      color: #050505;
    }
    .light .brand-dot {
      background: #111;
      color: #fff;
    }
    .text-link {
      min-height: 40px;
      border: 0;
      background: transparent;
      color: inherit;
      font-size: 13px;
      font-weight: 720;
      opacity: .78;
    }
    .welcome-stage {
      position: relative;
      min-height: 374px;
      overflow: hidden;
      border-radius: 16px;
      background: #090909;
      border: 1px solid var(--line-dark);
      isolation: isolate;
    }
    .welcome-stage .scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .58;
      filter: saturate(.7) contrast(1.05);
      transform: scale(1.02);
    }
    .welcome-stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(5,5,5,.06), rgba(5,5,5,.34) 46%, rgba(5,5,5,.92)),
        radial-gradient(circle at 78% 20%, rgba(255,255,255,.16), transparent 30%);
      pointer-events: none;
    }
    .welcome-hardware {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, .95fr) 112px;
      align-items: end;
      gap: 14px;
    }
    .welcome-phone {
      min-height: 188px;
      border-radius: 22px;
      background: #f7f7f7;
      color: #111;
      padding: 10px;
      box-shadow: 0 14px 34px rgba(0,0,0,.36);
    }
    .phone-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: 760;
      color: #666;
    }
    .phone-live {
      position: relative;
      min-height: 84px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 12px;
      background: #101010;
    }
    .phone-live img {
      width: 100%;
      height: 100%;
      min-height: 84px;
      object-fit: cover;
      opacity: .78;
      filter: grayscale(.25);
    }
    .phone-card-line {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      min-height: 36px;
      margin-top: 8px;
      border-radius: 10px;
      background: #ececec;
      padding: 8px;
      font-size: 11px;
      font-weight: 760;
    }
    .product-float {
      display: grid;
      place-items: center;
      min-height: 158px;
      border-radius: 16px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
    }
    .product-float img {
      width: 104px;
      max-height: 144px;
      object-fit: contain;
      filter: drop-shadow(0 18px 24px rgba(0,0,0,.45));
    }
    .welcome-copy {
      display: grid;
      gap: 12px;
    }
    .welcome-copy h1 {
      font-size: 34px;

      height: 32px;

      background: #f0f0f0;
    }

      min-height: 148px;

    .profile-grid {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 10px;
    }

      font-weight: 680;

      display: grid;

      deleteAccount: () => sheetWrap('注销账号', '注销前需要先转移家庭管理员或解绑设备。儿童照片、报告、对话摘要和任务证据会进入删除确认流程。', btn('了解并继续','data-close data-toast="已进入注销确认流程"','danger')),
      zone: () => sheetWrap('新增安全区域', '选择摄像头视角中的区域，设置触发条件、冷却时间和通知对象。', `<div class="grid-2">${btn('门口','data-close data-toast="已选择门口区域"','secondary')}${btn('厨房','data-close data-toast="已选择厨房区域"','secondary')}${btn('窗边','data-close data-toast="已选择窗边区域"','secondary')}${btn('自定义','data-close data-toast="已开始自定义框选"','primary')}</div>`),
      moment: () => sheetWrap('成长时刻操作', '成长时刻优先收藏积极行为。家长可以收藏、隐藏、删除或分享给家庭成员。', `<div class="grid-2">${btn('收藏','data-close data-toast="已收藏"','primary')}${btn('分享','data-close data-toast="已分享给爸爸"','secondary')}${btn('隐藏','data-close data-toast="已隐藏"','secondary')}${btn('删除','data-close data-toast="已删除"','danger')}</div>`),
      flowItem: () => sheetWrap('任务操作', '对卡住的任务可以延后、跳过、完成或提醒，所有操作会进入处理记录。', `<div class="grid-2">${btn('延后','data-close data-toast="已延后 10 分钟"','secondary')}${btn('提醒','data-close data-toast="已发送语音提醒"','secondary')}${btn('完成','data-close data-toast="已标记完成"','primary')}${btn('跳过','data-close data-toast="已跳过并记录原因"','danger')}</div>`),
      call: () => sheetWrap('发起音频通话', '通话前设备端会提示孩子“妈妈正在联系你”。隐私模式开启时需要管理员确认。', `<div class="grid-2">${btn('开始通话','data-close data-toast="正在发起通话"','primary','phone')}${btn('取消','data-close','secondary')}</div>`),
      pointMilestone: () => sheetWrap(state.pointUnit + '已积满', `当前可用 ${state.pointBalance}，按每阶段 ${state.pointThreshold} ${state.pointUnit} 提醒兑换。`, `<div class="grid-2">${btn('选择奖品','data-sheet="manualReward"','primary')}${btn('继续累积','data-action="milestone-continue"','secondary')}</div>${btn('调整阶段阈值','data-sheet="pointRule"','secondary','settings')}`),
      pointRule: () => sheetWrap('奖励阶段设置', '家长可以选择积分、小红花或小星星作为计量方式。默认阈值 10。', `${formField('每个阶段需要', state.pointThresholdDraft, 'pointRuleInput', 'number')}${btn('保存设置','data-action="point-rule-save"','primary')}`),
      manualReward: () => sheetWrap('家长主动兑换', '不需要孩子先申请，家长可以直接选择奖品并兑换。', `<div class="list">${row('gift','周末一起骑车','需要 20 ' + state.pointUnit,'data-action="manual-reward-select"', '选择')}${row('star','晚饭后一起桌游','需要 30 ' + state.pointUnit,'data-action="manual-reward-select"', '选择')}</div>${btn('确认兑换并扣 20 ' + state.pointUnit,'data-action="manual-reward-confirm"','primary')}`),
      reward: () => sheetWrap('确认奖励申请', `${state.childName}对摄像头说“我想换周末户外活动”。摄像头只转交申请，不直接承诺结果。`, `<div class="grid-2">${btn('同意并兑现','data-action="reward-result" data-result="fulfilled"','primary')}${btn('同意稍后','data-action="reward-result" data-result="planned"','secondary')}${btn('暂不兑换','data-action="reward-result" data-result="rejected"','danger')}</div>`),
      safety: () => sheetWrap('测试紧急联系人', '测试会给管理员和第二联系人发送模拟安全通知，不会触发真实报警。', btn('发送测试','data-close data-toast="测试通知已发送"','danger')),
      boundaries: () => sheetWrap('默认互动边界', '命名这一步只说明默认规则，不要求家长马上配置。保存后可在对话与人设中调整。', `<div class="list">${row('book','作业模式','只允许任务相关问答和温和提示','')}${row('moon','睡前模式','不主动开启长时间自由聊天','')}${row('file','记录策略','普通闲聊默认只保存主题摘要','')}</div><div class="grid-2">${btn('知道了','data-close','secondary')}${btn('去设置','data-go="conversation"','primary')}</div>`),
      contact: () => sheetWrap('添加紧急联系人', '', `${formField('姓名','外婆','contactName')}${formField('手机号','138 1234 5678','contactPhone','tel')}${btn('保存','data-close data-toast="联系人已添加"','primary')}`),
      member: () => sheetWrap('成员权限', '', `<div class="grid-2">${btn('管理员','data-close data-toast="已设为管理员"','primary')}${btn('监护人','data-close data-toast="已设为监护人"','secondary')}${btn('临时查看者','data-close data-toast="已设为临时查看者"','secondary')}</div>`),
      packing: () => sheetWrap('添加到小书包', '可临时加入老师通知或活动材料。', `${formField('物品名称','校服外套','packingDraft')}${btn('保存到小书包','data-action="packing-add"','primary')}`),
      task: () => sheetWrap('创建任务', '普通新建需要先选任务日期。保存后进入当天任务列表。', `${formField('任务名称','英语听读','taskName')}${formField('开始时间','19:50','taskStart','time')}<div class="grid-2" style="margin-top:12px">${btn('选择日期','data-sheet="taskDate"','secondary','calendar')}${btn('套模板','data-sheet="taskTemplates"','secondary','spark')}</div><div class="grid-2" style="margin-top:12px">${btn('保存并继续','data-action="manual-save-continue"','secondary')}${btn('保存到任务','data-action="manual-save"','primary')}</div>`),
      taskDate: () => sheetWrap('选择任务日期', '可选择今天、明天或未来日期。', `<div class="grid-2">${btn('今天','data-action="manual-date" data-date="today"','primary')}${btn('明天','data-action="manual-date" data-date="tomorrow"','secondary')}${btn('本周五','data-action="manual-date" data-date="future"','secondary')}${btn('日历选择','data-action="manual-date-pick" data-date="future"','secondary')}</div>`),
      taskTemplates: () => sheetWrap('套用一天任务模板', '模板会合并到选中的日期，不覆盖已有任务。', `<div class="list">${row('book','上学日晚间','作业、晚饭、小书包、睡前','data-action="day-template-select"', '选择')}${row('moon','睡前任务','洗漱、书包、上床','data-action="day-template-select"', '选择')}</div>${btn('套用模板','data-action="day-template-apply"','primary')}`),
      taskEdit: () => sheetWrap('编辑任务', '支持修改、延后、复制到明天或删除。', `<div class="grid-2">${btn('延后 10 分钟','data-action="task-delay"','secondary')}${btn('复制到明天','data-action="task-duplicate"','secondary')}${btn('删除','data-action="task-delete"','danger')}${btn('保存修改','data-action="task-edit-save"','primary')}</div>`),
      timePicker: () => sheetWrap('选择时间', '', `<div class="grid-3">${['17:30','18:20','19:00','19:50','20:30','21:10'].map(t=>`<button class="btn secondary" data-action="time-select" data-time="${t}">${t}</button>`).join('')}</div>`),
      playback: () => sheetWrap('回放片段', '片段只用于家长判断任务和安全事件，默认不会分享给家庭外成员。', `<img src="${assets.watch}" alt="回放片段" style="width:100%;border-radius:8px;margin:10px 0 14px">${btn('关闭','data-close','primary')}`),
      rewardEdit: () => sheetWrap('添加或修改奖励', '', `${formField('奖品名称','周末一起骑车','rewardName')}${formField('所需数量','20','rewardCost','number')}${btn('保存奖励','data-action="reward-save"','primary')}`),
      deleteData: () => sheetWrap('删除儿童数据', '删除会影响报告、证据和成长时刻。安全事件按合规策略保留最小必要内容。', btn('确认删除','data-close data-toast="已提交删除申请"','danger')),
      unbind: () => sheetWrap('解绑设备', '解绑前请确认报告和证据已经同步。设备解绑后将停止远程看护和任务提醒。', btn('继续','data-close data-toast="已进入管理员确认"','danger')),
      feedback: () => sheetWrap('提交产品反馈', '', `<div class="field"><label for="feedbackText">问题说明</label><textarea id="feedbackText">希望报告里能单独看睡前任务。</textarea></div>${btn('提交','data-close data-toast="反馈已提交"','primary')}`)
    };

    function sheetWrap(title, desc, content) {
      return `<div class="grabber"></div><h2>${title}</h2>${desc ? `<p class="copy" style="color:#666;margin-top:8px">${desc}</p>` : ''}<div style="margin-top:16px">${content}</div>`;
    }

    function setScreen(id) {
      if (!routes[id]) id = 'home';
      state.current = id;
      state.fabOpen = false;
      history.replaceState(null, '', `?screen=${encodeURIComponent(id)}`);
      render();
    }
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }
    function showSheet(name) {
      const content = sheetContent[name] || sheetContent.privacy;
      sheet.innerHTML = `<div class="sheet-panel">${content()}</div>`;
      sheet.classList.add('open');
      state.sheet = name;
    }
    function closeSheet() {
      sheet.classList.remove('open');
      sheet.innerHTML = '';
      state.sheet = '';
    }
    function showGuide() {
      guide.innerHTML = `<div class="guide-card"><h2>首次进入看护</h2><p class="copy" style="color:#555;margin-top:8px">底部中间按钮用于快速创建任务。实时看护前会先说明设备端可见提示和隐私边界。</p><button class="btn primary block" data-close-guide style="margin-top:16px">我知道了</button></div><span class="guide-arrow" aria-hidden="true"></span>`;
      guide.classList.add('open');
    }

    function handleAction(target) {
      const action = target.dataset.action;
      if (!action) return false;
      if (action === 'login-submit') {
        if (state.loginError) {
          const panel = app.querySelector('.auth-card');
          panel && panel.classList.add('shake');
          showToast('验证码错误，请重新输入');
        } else {
          setScreen('parentIdentity');
          showToast('登录成功');
        }
        return true;
      }
      if (action === 'welcome-next') {
        state.welcomeSlide = Math.min(welcomeSlides.length - 1, state.welcomeSlide + 1);
        render();
        return true;
      }
      if (action === 'login-error-demo') { state.loginError = true; render(); return true; }
      if (action === 'parent-role') { state.parentRole = target.dataset.role || state.parentRole; state.parentName = state.parentRole; state.identityError = false; render(); return true; }
      if (action === 'identity-submit') {
        if (!state.parentRole) {
          state.identityError = true;
          render();
          showToast('请选择家长身份');
        } else {
          setScreen('bind');
        }
        return true;
      }
      if (action === 'bind-search') {
        state.bindState = 'searching';
        render();
        showToast('正在搜索附近设备');
        clearTimeout(handleAction.bindTimer);
        handleAction.bindTimer = setTimeout(() => {
          if (state.current === 'bind' && state.bindState === 'searching') {
            state.bindState = 'found';
            render();
            showToast('发现 1 台摄像头');
          }
        }, 780);
        return true;
      }
      if (action === 'bind-fail') { state.bindState = 'failed'; render(); showToast('未找到设备'); return true; }
      if (action === 'bind-connect') { state.bindState = 'found'; setScreen('wifi'); return true; }
      if (action === 'bind-submit') { showToast('正在绑定设备'); setTimeout(() => setScreen('bindDone'), 320); return true; }
      if (action === 'wifi-toggle-password') { state.showWifiPassword = !state.showWifiPassword; render(); return true; }
      if (action === 'wifi-fail-demo') { state.wifiFail = true; state.wifiLoading = false; render(); showToast('Wi-Fi 密码错误'); return true; }
      if (action === 'wifi-clear-error') { state.wifiFail = false; render(); showToast('已清除错误'); return true; }
      if (action === 'wifi-submit') {
        if (state.wifiLoading) return true;
        if (state.wifiFail) {
          const panel = app.querySelector('.wifi-sheet');
          panel && panel.classList.add('shake');
          showToast('请检查密码后重试');
          return true;
        }
        state.wifiLoading = true;
        render();
        showToast('正在连接 Wi-Fi');
        clearTimeout(handleAction.wifiTimer);
        handleAction.wifiTimer = setTimeout(() => {
          state.wifiLoading = false;
          state.wifiFail = false;
          setScreen('bindDone');
          showToast('设备绑定成功');
        }, 900);
        return true;
      }
      if (action === 'task-day') { state.taskDay = target.dataset.day || 'today'; render(); return true; }
      if (action === 'task-open') { showSheet('taskEdit'); return true; }
      if (['manual-date','manual-date-pick'].includes(action)) { closeSheet(); showSheet('task'); showToast('已选择任务日期'); return true; }
      if (['manual-save','manual-save-continue'].includes(action)) { closeSheet(); setScreen('tasks'); showToast(action === 'manual-save' ? '任务已创建' : '已保存，可以继续添加下一条'); return true; }
      if (['day-template-select'].includes(action)) { showToast('已选择模板'); return true; }
      if (action === 'day-template-apply') { closeSheet(); setScreen('tasks'); showToast('已套用上学日晚间模板'); return true; }
      if (['task-delay','task-duplicate','task-edit-save','task-delete'].includes(action)) { closeSheet(); setScreen('tasks'); showToast(action === 'task-delete' ? '任务已删除' : action === 'task-duplicate' ? '已复制到明天' : action === 'task-delay' ? '已延后 10 分钟' : '任务已更新'); return true; }
      if (action === 'time-select') { closeSheet(); showSheet('task'); showToast('时间已更新'); return true; }
      if (action === 'setting-toggle') { const key = target.dataset.setting; state.toggles[key] = !state.toggles[key]; render(); showToast('设置已保存'); return true; }
      if (action === 'evidence-result') { state.evidenceStatus = target.dataset.result; closeSheet(); setScreen('taskDetail'); showToast(state.evidenceStatus === 'confirmed' ? '已确认完成' : state.evidenceStatus === 'partial' ? '已改为部分完成' : '已驳回 AI 判断'); return true; }
      if (action === 'point-rule-save') { const input = document.getElementById('pointRuleInput'); const value = Number(input && input.value); if (!Number.isInteger(value) || value < 1) { showToast('请输入阶段阈值'); return true; } state.pointThreshold = value; state.pointThresholdDraft = String(value); closeSheet(); render(); showToast('阶段规则已保存'); return true; }
      if (action === 'manual-reward-select') { showToast('已选择奖品'); return true; }
      if (action === 'manual-reward-confirm') { state.pointBalance = Math.max(0, state.pointBalance - 20); closeSheet(); setScreen('points'); showToast('已兑换并扣除' + state.pointUnit); return true; }
      if (action === 'reward-result') { state.rewardStatus = target.dataset.result; closeSheet(); setScreen('reward'); showToast(state.rewardStatus === 'fulfilled' ? '已同意并兑现' : state.rewardStatus === 'planned' ? '已同意稍后提醒' : '已暂不兑换'); return true; }
      if (action === 'reward-add-open' || action === 'reward-edit-open') { showSheet('rewardEdit'); return true; }
      if (action === 'reward-delete') { showToast('至少保留一个奖品'); return true; }
      if (action === 'reward-save') { closeSheet(); setScreen('reward'); showToast('奖励已添加'); return true; }
      if (action === 'packing-status') { showToast(`${target.dataset.item}状态已更新`); return true; }
      if (action === 'packing-add') { closeSheet(); setScreen('packing'); showToast('已保存到小书包'); return true; }
      if (action === 'schoolbag-mode') { showToast('小书包规则已更新'); return true; }
      if (action === 'milestone-continue') { closeSheet(); setScreen('points'); showToast('已继续累积'); return true; }
      if (action === 'fake-loading') { showToast('保存中'); setTimeout(() => showToast('操作已完成'), 650); return true; }
      return false;
    }

    function renderNav() {
      const root = rootFor(state.current);
      const hidden = onboardingScreens.has(state.current) && !['homeEmpty','homeError','watchOffline','watchPrivacy','deviceOffline','componentStates'].includes(state.current);
      tabbar.classList.toggle('hidden', hidden);
      quickActions.classList.toggle('open', state.fabOpen && !hidden);
      tabbar.innerHTML = [
        ['home','home','首页'],
        ['tasks','tasks','任务'],
        ['plus','plus',''],
        ['watch','watch','看护'],
        ['my','user','我的']
      ].map(([id, iconName, label]) => id === 'plus'
        ? `<button class="main-fab ${state.fabOpen ? 'open' : ''}" data-action="fab-toggle" aria-label="创建任务">${svg('plus')}</button>`
        : `<button class="nav-btn ${root === id ? 'active' : ''}" data-go="${id}" aria-current="${root === id ? 'page' : 'false'}">${svg(iconName)}<span>${label}</span></button>`
      ).join('');
    }

    function render() {
      const dark = darkScreens.has(state.current);
      shell.classList.toggle('light', !dark);
      app.innerHTML = routes[state.current] ? routes[state.current]() : routes.home();
      renderNav();
      closeSheet();
      app.scrollTo({ top: 0, behavior: 'instant' });
    }

    document.addEventListener('click', event => {
      const target = event.target.closest('button, a');
      if (!target) return;
      if (target.dataset.close !== undefined) closeSheet();
      if (target.dataset.closeGuide !== undefined) guide.classList.remove('open');
      if (target.dataset.action === 'fab-toggle') {
        state.fabOpen = !state.fabOpen;
        renderNav();
        return;
      }
      if (handleAction(target)) return;
      if (target.dataset.go) setScreen(target.dataset.go);
      if (target.dataset.sheet) showSheet(target.dataset.sheet);
      if (target.dataset.toast) showToast(target.dataset.toast);
    });
    sheet.addEventListener('click', event => {
      if (event.target === sheet) closeSheet();
    });
    guide.addEventListener('click', event => {
      if (event.target === guide) guide.classList.remove('open');
    });

    render();
    if (state.current === 'home' && !localStorage.getItem('mira-v3-guide-seen')) {
      localStorage.setItem('mira-v3-guide-seen', '1');
      setTimeout(showGuide, 500);
    }
  </script>
</body>
</html>
