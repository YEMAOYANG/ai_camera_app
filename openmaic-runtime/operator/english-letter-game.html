<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字母找朋友</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff8e7;color:#53341e;font-family:Arial,"PingFang SC",sans-serif;padding:20px;display:grid;place-items:center;min-height:100vh}main{width:min(100%,680px);text-align:center;background:#fffdfa;border:2px solid #e6c993;border-radius:28px;padding:20px}h1{font-size:30px;margin:0 0 8px}p{margin:10px 0;font-size:21px}#upper{font-family:Georgia,serif;font-size:90px;line-height:1.1;margin:12px auto;width:145px;background:#e4f1e7;border-radius:20px;padding:12px}.options{display:flex;justify-content:center;gap:22px}button{font:inherit;cursor:pointer;border:2px solid #c79c72;border-radius:15px;background:white;color:#53341e;padding:10px 18px;min-height:46px}button:focus-visible{outline:4px solid #28758b}.options button{font-family:Georgia,serif;font-size:48px;width:100px}button:disabled{cursor:default;opacity:.6}.correct{background:#d0edd8!important}#feedback{min-height:60px;font-size:21px;line-height:1.4}footer{font-size:14px;margin-top:12px;color:#796b56}
</style><main><h1>字母找朋友</h1><p>看大写，找小写。</p><div id="upper">I</div><div class="options"><button id="opt-i">i</button><button id="opt-l">l</button><button id="opt-p">p</button></div><p id="feedback" aria-live="polite">先看上面的字母，再选一个。</p><p id="counter">找到 0 / 4 对 · 0 分</p><button id="next" disabled>下一张</button> <button id="reset">重新开始</button><footer>来源：《义务教育英语课程标准（2022年版）》</footer></main>
<script>
const cards=[{up:'I',low:'i',hint:'I 的小写有一竖一点。'},{up:'L',low:'l',hint:'L 的小写是一根竖线，没有点。'},{up:'P',low:'p',hint:'P 的小写有小肚子，竖线伸到下面。'},{up:'K',low:'k',hint:'K 的小写也有伸出来的两笔。'}];
let index=0,matched=0,solved=false;const byId=id=>document.getElementById(id);
function draw(){solved=false;byId('upper').textContent=cards[index].up;const options=index===3?['i','l','k']:['i','l','p'];document.querySelectorAll('.options button').forEach((b,i)=>{b.id='opt-'+options[i];b.textContent=options[i];b.disabled=false;b.className='';b.onclick=()=>choose(b,options[i]);});byId('next').disabled=true;byId('feedback').textContent='先看上面的字母，再选一个。';byId('counter').textContent=`找到 ${matched} / 4 对 · ${matched*10} 分`;}
function choose(button,letter){if(solved)return;if(letter!==cards[index].low){byId('feedback').textContent=`再看一看：${cards[index].hint} 还可以选一次。`;return;}solved=true;matched++;button.className='correct';byId('counter').textContent=`找到 ${matched} / 4 对 · ${matched*10} 分`;byId('feedback').textContent=`找到了！${cards[index].up} 和 ${letter} 是一对。`+(matched===4?' 四对都找到啦！':' 点下一张继续。');byId('next').disabled=index===3;document.querySelectorAll('.options button').forEach(b=>b.disabled=true);}
byId('next').onclick=()=>{if(solved&&index<3){index++;draw();}};byId('reset').onclick=()=>{index=0;matched=0;draw();};draw();
</script></html>
