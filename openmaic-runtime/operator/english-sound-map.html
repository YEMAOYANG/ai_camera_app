<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听开头，找朋友</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f7ed;color:#253e31;font-family:Arial,"PingFang SC",sans-serif;padding:18px;min-height:100vh;display:grid;place-items:center}main{width:min(100%,820px);padding:18px 24px;border:2px solid #bed6b9;border-radius:24px;background:#fffef9;text-align:center}h1{font-size:29px;margin:0 0 10px}p{font-size:20px;line-height:1.4;margin:10px 0}.examples{display:flex;justify-content:center;gap:20px;background:#edf4e5;border-radius:16px;padding:12px;font-size:24px}.examples span{display:inline-block}b.initial{color:#ad442a;text-decoration:underline;text-underline-offset:5px}button{font:inherit;font-size:24px;min-height:46px;padding:9px 18px;border:2px solid #a6bca2;border-radius:12px;background:white;color:#253e31;cursor:pointer;margin:4px}button:focus-visible{outline:4px solid #357a97}button[aria-pressed=true]{border-color:#397b59;background:#dcf0df}button:disabled{opacity:.6;cursor:default}.letters button{font-size:29px}.words{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}#feedback{min-height:58px}footer{font-size:14px;color:#62745d;margin-top:8px}.helper{font-size:17px;color:#4b5d46}
</style><main><h1>听开头，找朋友</h1><div class="examples"><span id="word-rabbit">R r → <b class="initial">r</b>abbit 兔子</span><span id="word-key">K k → <b class="initial">k</b>ey 钥匙</span></div><p class="helper">跟老师读一读：rabbit，key。红色字母提示开头的声音。</p><p>① 选字母</p><div class="letters"><button id="letter-r" aria-pressed="true">R r</button><button id="letter-k" aria-pressed="false">K k</button></div><p>② 选单词，再确认</p><div class="words"><button id="word-red">red 红色</button><button id="word-sun">sun 太阳</button><button id="word-kite">kite 风筝</button><button id="word-lion">lion 狮子</button></div><p id="feedback" aria-live="polite">现在找开头和 R r 相同的单词。</p><button id="confirm" disabled>确认</button><button id="reset">重新开始</button><p id="counterDisplay">找到 0 / 2 个</p><footer>来源：《义务教育英语课程标准（2022年版）》</footer></main>
<script>
const byId=id=>document.getElementById(id),words={red:{letter:'r',meaning:'红色'},sun:{letter:'s',meaning:'太阳'},kite:{letter:'k',meaning:'风筝'},lion:{letter:'l',meaning:'狮子'}};
let target='r',selected=null,found=new Set();
function selectTarget(letter){target=letter;selected=null;byId('confirm').disabled=true;for(const l of ['r','k'])byId('letter-'+l).setAttribute('aria-pressed',String(l===target));for(const word of Object.keys(words))byId('word-'+word).setAttribute('aria-pressed','false');byId('feedback').textContent=`现在找开头和 ${target.toUpperCase()} ${target} 相同的单词。`;}
for(const letter of ['r','k'])byId('letter-'+letter).onclick=()=>selectTarget(letter);
for(const word of Object.keys(words))byId('word-'+word).onclick=()=>{selected=word;byId('confirm').disabled=false;for(const w of Object.keys(words))byId('word-'+w).setAttribute('aria-pressed',String(w===word));byId('feedback').textContent=`你选了 ${word}。点确认，检查开头。`;};
byId('confirm').onclick=()=>{if(!selected)return;const correct=words[selected].letter===target;if(correct){found.add(target);byId('feedback').textContent=`找到了！${selected} 的开头是 ${target}，和 ${target.toUpperCase()} ${target} 对上了。`+(found.size===2?' 两个都找到啦！':' 再试试另一个字母。');}else{byId('feedback').textContent=`再比一比：${selected} 开头是 ${words[selected].letter}，不是 ${target}。看看红色的示范字母，再选一个。`;}byId('counterDisplay').textContent=`找到 ${found.size} / 2 个`;};
byId('reset').onclick=()=>{found.clear();byId('counterDisplay').textContent='找到 0 / 2 个';selectTarget('r');};
</script></html>
